<title>Voyager Layout Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one long review sheet. Each layer is a band holding Current | Expert A | Expert B boards, with the two experts' reasoning underneath. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --ink:#1b2130; --muted:#5d6577; --line:#d5d9e2; --case:#2a2f3b;
  --accent:#3559d6; --a:#0f8a6a; --b:#b4531a;
  --k-alpha:#dfe8fb; --k-mod:#d6f0dc; --k-num:#fbdde8; --k-sym:#fbf0c9; --k-edit:#e4e7ee; --k-nav:#fbd9d4;
  --k-ide:#d3eeee; --k-media:#fde3c8; --k-mouse:#e8dcfa; --k-sys:#e7e2d6; --k-fn:#dcdcf7; --k-macro:#f6dcf2;
  --k-none:#f1f2f5; --k-ink:#1b2130; --chg:#e0336b;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --key: clamp(24px, 2.05vw, 32px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141821; --panel:#1c212c; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2f3646; --case:#0c0f15;
  --accent:#8aa4ff; --a:#4fd1a8; --b:#f0975c;
  --k-alpha:#2a3956; --k-mod:#24452f; --k-num:#4d2737; --k-sym:#4a4120; --k-edit:#323846; --k-nav:#52302b;
  --k-ide:#1f4545; --k-media:#4f3820; --k-mouse:#3b2d55; --k-sys:#3e3a30; --k-fn:#30305a; --k-macro:#4a2a47;
  --k-none:#20242e; --k-ink:#eef1f7; --chg:#ff6b9a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141821; --panel:#1c212c; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2f3646; --case:#0c0f15;
  --accent:#8aa4ff; --a:#4fd1a8; --b:#f0975c;
  --k-alpha:#2a3956; --k-mod:#24452f; --k-num:#4d2737; --k-sym:#4a4120; --k-edit:#323846; --k-nav:#52302b;
  --k-ide:#1f4545; --k-media:#4f3820; --k-mouse:#3b2d55; --k-sys:#3e3a30; --k-fn:#30305a; --k-macro:#4a2a47;
  --k-none:#20242e; --k-ink:#eef1f7; --chg:#ff6b9a; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
.wrap{max-width:1440px;margin:0 auto;padding-block:32px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:40px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,42px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px;font-weight:700}
h3{font-size:17px;font-weight:700}
p{margin:0;max-width:72ch}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:16.5px}
header{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.grid2>*,.grid3>*{min-width:0}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
li{max-width:80ch}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.tag{display:inline-block;font-family:var(--f-mono);font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.04em}
.tA{color:var(--a)} .tB{color:var(--b)} .tC{color:var(--muted)}
.who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
section.layer{display:flex;flex-direction:column;gap:16px;border-top:1px solid var(--line);padding-top:28px}
.boards{display:grid;grid-template-columns:repeat(3,max-content);gap:18px;overflow-x:auto;padding-bottom:6px}
@media (max-width:1260px){.boards{grid-template-columns:repeat(2,max-content)}}
@media (max-width:900px){.boards{grid-template-columns:max-content}}
.board{display:flex;flex-direction:column;gap:8px}
.bcap{display:flex;flex-direction:column;gap:2px}
.bcap b{font-family:var(--f-display);font-size:15px}
.bcap span{font-size:12.5px;color:var(--muted)}
.kb{background:var(--case);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;width:max-content}
.halves{display:flex;gap:calc(var(--key)*.7)}
.half{display:grid;grid-template-columns:repeat(6,var(--key));gap:3px}
.thumbs{display:flex;gap:calc(var(--key)*.7);margin-top:4px}
.tside{width:calc(var(--key)*6 + 15px);display:flex}
.tside.l{justify-content:flex-end} .tside.r{justify-content:flex-start}
.tpair{display:flex;gap:3px}
.tpair .k{width:calc(var(--key)*1.2)}
.tpair.l{transform:translateX(calc(var(--key)*.15)) rotate(7deg);transform-origin:right top}
.tpair.r{transform:translateX(calc(var(--key)*-.15)) rotate(-7deg);transform-origin:left top}
.k{width:var(--key);height:var(--key);border-radius:5px;background:var(--k-none);color:var(--k-ink);position:relative;display:flex;align-items:center;justify-content:center;font-family:var(--f-mono);font-weight:700;font-size:calc(var(--key)*.34);line-height:1;text-align:center;overflow:hidden;white-space:nowrap}
.k .t{padding:0 1px;max-width:100%;overflow:hidden}
.k .h{position:absolute;bottom:1px;left:0;right:0;font-size:calc(var(--key)*.24);font-weight:500;opacity:.8}
.k.has-h .t{transform:translateY(-18%)}
.k.long .t{font-size:calc(var(--key)*.26)}
.k.xlong .t{font-size:calc(var(--key)*.21)}
.k.trns{background:transparent;border:1px dashed color-mix(in srgb, var(--k-none) 40%, transparent)}
.k.trns .t{opacity:.35;font-weight:500}
.k.none{opacity:.28}
.c-alpha{background:var(--k-alpha)} .c-mod{background:var(--k-mod)} .c-num{background:var(--k-num)} .c-sym{background:var(--k-sym)}
.c-edit{background:var(--k-edit)} .c-nav{background:var(--k-nav)} .c-ide{background:var(--k-ide)} .c-media{background:var(--k-media)}
.c-mouse{background:var(--k-mouse)} .c-sys{background:var(--k-sys)} .c-fn{background:var(--k-fn)} .c-macro{background:var(--k-macro)}
.showchg .k.chg{box-shadow:inset 0 0 0 2px var(--chg)}
.legend{display:flex;flex-wrap:wrap;gap:10px 16px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.controls{display:flex;gap:18px;flex-wrap:wrap;align-items:center;font-size:14px}
.controls label{display:flex;gap:6px;align-items:center;cursor:pointer}
.controls input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opinions{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.opinions>*{min-width:0}
.op{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.op.A{border-top:3px solid var(--a)} .op.B{border-top:3px solid var(--b)} .op.C{border-top:3px solid var(--muted)}
.op li{font-size:14px}
.why{font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:4px 0 0;white-space:pre-wrap;overflow-x:auto}
.verdict{border-left:4px solid var(--accent)}
nav.toc{display:flex;flex-wrap:wrap;gap:8px}
nav.toc a{font-family:var(--f-mono);font-size:12.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:4px 10px;border-radius:99px}
nav.toc a:hover,nav.toc a:focus-visible{border-color:var(--accent);outline:none}
@media (prefers-reduced-motion:no-preference){ .k{transition:box-shadow .15s} }
</style>

<div class="wrap" id="app">
  <header>
    <div class="eyebrow">ZSA Voyager + Navigator · layout nd96R · macOS</div>
    <h1>Voyager layout review</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div id="intro"></div>
  <div class="panel" style="display:flex;flex-direction:column;gap:12px">
    <div class="controls">
      <label><input type="checkbox" id="chg" checked> Outline keys that changed from your current layout</label>
      <label><input type="checkbox" id="hold" checked> Show hold actions</label>

    <div class="legend" id="legend"></div>
    <nav class="toc" id="toc" aria-label="Layers"></nav>
  </div>
  <div id="layers" class="showchg" style="display:flex;flex-direction:column;gap:36px"></div>
  <div id="outro" style="display:flex;flex-direction:column;gap:36px"></div>
</div>

nky column and the Esc/⇧ thumb go away, and Shift is now on the strongest finger of each hand, the same on every layer.", "The thumbs get new jobs so that each layer key sits on the opposite hand from what it holds: Space/NAV on L-outer (Space stays, NAV moves here from L-inner), Tab/NUM on L-inner, Enter/FUN on R-inner, and Bspc/SYM on R-outer. Space and Backspace are the taps on the two primary thumbs.", "Esc leaves the corner key and the right thumb and becomes a J+K tap combo. It sends a real Esc, so it works in insert mode, the terminal and chat. Holding J+K still gives ⇧⌘ for shortcuts.", "= leaves the bottom-right outer key, a diagonal pinky stretch, and goes to the SYM home row. The second Tab and the second Bspc are removed. The other outer keys and the whole number row are empty on purpose.", "' stays on the right outer home key. It is the only outer-column key I kept: you type apostrophes in chat all day, it would be worse behind a layer, and this is the ANSI spot your finger already knows.", "Kept as they are: the QWERTY letters (so HJKL and your typing speed survive), : on the right pinky home key (tap :, hold ⌃) and ; at bottom right. Both are good choices for Vim and Rust.", "New (C): a key override makes Shift+; send ?. That puts ? back where QWERTY fingers expect it, Shift plus the bottom-right pinky key, and the combination is otherwise wasted because today it only repeats the : you already have."], "why": "Every key you press thousands of times a day is now under a thumb, on the home row, or a home-row combo. That covers Space, Backspace, Enter, Tab, Shift and Esc. The pinkies only type letters and : ; '. All four modifiers repeat on both home rows in the same order, so any shortcut can be an easy chord across both hands. Chordal Hold and Flow Tap keep fast typing free of accidental modifiers."}, {"id": 1, "replaces": 1, "name": "Numbers", "activation": "hold L-inner thumb (tap = Tab)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "--", "--", "--", "--", "--", "+", "7", "8", "9", "*", "--"], ["--", "⌃", "⌥", "⌘", "⇧", "LLock", "-", "4", "5", "6", ":", "--"], ["--", "--", "--", "--", "--", "--", "#", "1", "2", "3", "\\", "--"], ["", "", ".", "0"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "none", "none", "none", "none", "none", "sym", "num", "num", "num", "sym", "none"], ["none", "mod", "mod", "mod", "mod", "sys", "sym", "num", "num", "num", "sym", "none"], ["none", "none", "none", "none", "none", "none", "sym", "num", "num", "num", "sym", "none"], ["trns", "trns", "num", "num"]], "changes": ["The layer is now held with the L-inner thumb instead of R-inner, so the digits sit on the opposite hand as a built-in numpad: 789 / 456 / 123 on U I O / J K L / M , . with 0 under the right primary thumb and . on R-inner. Today 6 to 0 sit under the same hand that is holding the layer.", "The keypad operator keys (KP-, KP+, KP*, KP/) become plain + - * keys. Terminals and Vim can turn keypad codes into something else when application-keypad mode is on.", "The left home row gets plain ⌃ ⌥ ⌘ ⇧. ⌘1 to ⌘9 (VS Code editor groups, Slack and browser tabs) is now hold-and-tap with any digit, which replaces the ⌘1/⌘2 tap dance. ⇧ plus a digit gives the same symbols as on a normal number row: ! @ # $ % ^ & * ( ).", "The spare slots hold : (times, and ports such as localhost:8080), # (issue numbers) and \\. % and ^ lose their own keys because ⇧5 and ⇧6 already make them.", "Layer Lock goes on G, so long runs of numbers such as tables, IP addresses or test data don't need a held thumb.", "MyComputer (top right) is removed because it does nothing useful on macOS."], "why": "Holding with one hand and typing with the other leaves the right hand free to type numbers in the familiar numpad shape. The left thumb holds the layer and the left fingers add modifiers. That gives you ⌘+digit, ⇧+digit and ⌃+digit (tmux windows) for free, so the tap dance and the keypad keycodes can go."}, {"id": 2, "replaces": 2, "name": "Symbols", "activation": "hold R-outer thumb (tap = Backspace)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "`", "<", "{", "}", "@", "--", "--", "--", "--", "--", "--"], ["--", "=", "!", "(", ")", "&", "--", "⇧", "⌘", "⌥", "⌃", "--"], ["--", "/", ">", "[", "]", "|", "--", "--", "--", "--", "--", "--"], ["_", "-", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "none", "none", "none", "none", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "mod", "mod", "mod", "mod", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "none", "none", "none", "none", "none"], ["sym", "sym", "trns", "trns"]], "changes": ["The layer is now held with the R-outer thumb (Bspc) instead of L-outer (Space), and every symbol is on the left hand. Today half the symbols sit under the same hand that is holding the layer.", "The three bracket pairs stack on the middle and index fingers: { } on top, ( ) on the home row, [ ] below. Each pair is an inward roll, so println!( and vec![ type without changing rows.", "= (pinky) and ! (ring) go on the home row, with < above and > below them, so == != => <= >= are rolls between neighbouring fingers. _ and - move to the two left thumbs, so snake_case, --release and -> need no finger movement.", "/ ` @ | & join the main 3x5 keys. ? moves to ⇧; on the base layer and \" to ⇧'. < and > still also work as ⇧, and ⇧. as usual, and ~ is ⇧`. $ % ^ # * live on NUM, as their own keys or as ⇧ plus a digit. The extra copies of 0 and . are removed.", "The right home row gets plain ⇧ ⌘ ⌥ ⌃ for shortcuts that use a symbol: ⌘/ (toggle comment), ⌘[ and ⌘] (outdent and indent), ⌃` (terminal), ⌘= and ⌘- (zoom)."], "why": "Rust uses a lot of symbols. With the right thumb holding and the right fingers on modifiers, every symbol is under the left hand, so you never have to press a thumb and a finger of the same hand together. The most common Rust pairs (-> => != && || () {} []) become two-tap rolls inside the layer, and :: stays on the base pinky."}, {"id": 3, "replaces": 3, "name": "Nav / IDE", "activation": "hold L-outer thumb (tap = Space)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "⌃`", "⌘\\", "⌘⇧[", "⌘⇧]", "⌘⇧F", "⌥P", "⌥H", "⌥L", "⌥N", "⌃⇧-", "--"], ["--", "⌃", "⌥", "⌘", "⇧", "⌃⇧G", "←", "↓", "↑", "→", "⌃-", "--"], ["--", "⌘Z", "⌘X", "⌘C", "⌘V", "⌘⇧Z", "Home", "PgDn", "PgUp", "End", "CapsW", "--"], ["", "", "Enter", "Del"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "nav", "none"], ["none", "mod", "mod", "mod", "mod", "ide", "nav", "nav", "nav", "nav", "nav", "none"], ["none", "edit", "edit", "edit", "edit", "edit", "nav", "nav", "nav", "nav", "edit", "none"], ["trns", "trns", "edit", "edit"]], "changes": ["The layer is now held with L-outer (Space) instead of L-inner (Enter). The layer you hold most goes on the primary thumb, and Enter no longer shares a key with a layer you hold all day.", "The left home row becomes plain ⌃ ⌥ ⌘ ⇧: ⇧+arrows selects, ⌥+arrows jumps by word, ⌘+arrows goes to line or file ends, ⌃+arrows switches macOS Spaces, and ⌥↑/↓ moves a line in VS Code. The current layer has no modifiers at all.", "Kept exactly as they are: arrows on HJKL, Home/PgDn/PgUp/End under them, and the tmux keys ⌥P ⌥H ⌥L ⌥N above them. They still send Right Option; switch them to Left Option only if a terminal types special characters instead of running the binding.", "Shortcuts built on a symbol or a hard-to-chord key keep their own key: ⌘\\ ⌘⇧[ ⌘⇧] stay on W E R, ⌃` moves from V to Q, ⌘⇧F from D to T and ⌃⇧G from S to G. Shortcuts built on a letter (⌘⇧E, ⌘⇧H, ⌥⌘C, ⌥⌘⇧C, ⌘↓, ⌥Space) lose their key, because with home-row mods on both hands they are now easy chords: hold J+K and tap E, or hold L and tap Space.", "The bottom-left keys become ⌘Z ⌘X ⌘C ⌘V ⌘⇧Z on Z X C V B, so you can select with ⇧+arrows and copy or paste without leaving the layer. This is Seniply's Extend-layer convention.", "New: VS Code Back (⌃-) and Forward (⌃⇧-) on the right pinky column, for the jumps back and forth around go-to-definition that Rust navigation is full of. Caps Word goes under them.", "While you navigate, the right thumbs are Enter and Del. Media, volume and the screenshot key move to the new FUN layer, and the outer columns are cleared."], "why": "Navigation is now held on the primary thumb with modifiers under the same hand, so editing with arrows can really replace the mouse: select a word, jump to the end of a line, or move a line. The Vim-style arrow block you built stays exactly as it is, and the VS Code shortcuts that really need their own key keep one."}, {"id": 4, "replaces": 4, "name": "Mouse", "activation": "automouse (move the Navigator), or Layer Lock", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "--", "--", "CPI-", "CPI+", "TogScr", "BTN1", "BTN3", "BTN2", "--", "--", "--"], ["--", "⌃", "⌥", "⌘", "⇧", "Drag", "--", "--", "--", "--", "--", "--"], ["--", "⌘Z", "⌘X", "⌘C", "⌘V", "LLock", "--", "--", "--", "--", "--", "--"], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "none", "none", "sys", "sys", "mouse", "mouse", "mouse", "mouse", "none", "none", "none"], ["none", "mod", "mod", "mod", "mod", "mouse", "none", "none", "none", "none", "none", "none"], ["none", "edit", "edit", "edit", "edit", "sys", "none", "none", "none", "none", "none", "none"], ["trns", "trns", "trns", "trns"]], "changes": ["The left home row gets plain ⌃ ⌥ ⌘ ⇧, so ⌘-click (go to definition, open a link in a new tab), ⇧-click (extend a selection) and ⌥-click (add a cursor in VS Code) work without holding the modifier before you touch the ball.", "Clipboard keys on Z X C V (⌘Z ⌘X ⌘C ⌘V), the same as on NAV, so you can select with the mouse, copy, click and paste with one hand.", "Drag-scroll moves from F to G and toggle-scroll from G to T, to make room for ⇧ on F. Layer Lock moves from C to B. CPI- and CPI+ move to the top row (E and R), because you set them once and forget them.", "Kept: BTN1/BTN3/BTN2 on Y U I, which is where you put them for the Navigator, and transparent thumbs, so Space, Enter and Bspc still work while the pointer layer is on."], "why": "A pointer layer without modifiers forces you to hold them before you touch the ball. Putting the same four modifiers here means every layer uses one modifier map, and the most common mouse-plus-key actions in VS Code and the browser become one-handed."}, {"id": 5, "replaces": null, "name": "Fn / Media", "activation": "hold R-inner thumb (tap = Enter)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "F12", "F7", "F8", "F9", "⌘⇧4", "--", "--", "--", "--", "--", "--"], ["--", "F11", "F4", "F5", "F6", "Vol+", "--", "⇧", "⌘", "⌥", "⌃", "--"], ["--", "F10", "F1", "F2", "F3", "Vol-", "--", "--", "--", "--", "--", "--"], ["Play", "⌃⌘⇧4", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "fn", "fn", "fn", "fn", "sys", "none", "none", "none", "none", "none", "none"], ["none", "fn", "fn", "fn", "fn", "media", "none", "mod", "mod", "mod", "mod", "none"], ["none", "fn", "fn", "fn", "fn", "media", "none", "none", "none", "none", "none", "none"], ["media", "sys", "trns", "trns"]], "changes": ["New layer, held with R-inner (Enter). F1 to F12 sit on the left hand in the same 789 / 456 / 123 shape as the NUM digits, with F10 to F12 on the pinky column. The current layout has no F-keys at all, and VS Code wants F2 (rename symbol), F12 (go to definition), F8 (next problem) and F5/F9/F10/F11 (debugging).", "The right home row has ⇧ ⌘ ⌥ ⌃ for ⇧F12 (find references) and ⌥F12 (peek definition).", "Volume up and down and the ⌘⇧4 screenshot move here from NAV's outer columns, and Play/Pause goes on the left primary thumb.", "New: ⌃⌘⇧4 (screenshot an area to the clipboard) on L-inner, so you can paste straight into Slack or an LLM chat without a file landing on the desktop.", "Stop and Mute are dropped. Media Stop does nothing on macOS, and Mute is rarely needed next to Vol- and Play/Pause."], "why": "F-keys and media are rare enough to sit behind the least-used thumb hold. But a Rust workflow in VS Code really needs F2 and F12, and the current layout can't send them at all. Grouping them with the system keys also clears every outer-column key off NAV."}], "combos": [{"keys": "J+K (tap only)", "output": "Esc", "why": "Vim needs Esc constantly, and this keeps it on the home row with no thumb or corner reach. It is tap-only, so holding J+K still gives ⇧⌘ for shortcuts like ⌘⇧E. 'jk' almost never appears in English or Rust, so it rarely fires by accident."}, {"keys": "F+J (tap only)", "output": "Caps Word", "why": "Tap both Shift keys together to type SCREAMING_SNAKE_CASE Rust constants and chat acronyms (API, PR, LLM) without holding Shift. Caps Word turns itself off at the next space or punctuation."}], "macros": [], "features": [{"name": "Chordal Hold, with thumbs exempt (the exemption is C)", "config": "#define CHORDAL_HOLD\n// keymap.c (C): mark the thumbs '*' so the layer thumbs can chord with either hand\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n                 '*','*',  '*','*');", "why": "A home-row mod pressed with another key on the same hand types as a letter, which removes most rolling misfires such as 'as' turning into ⌃s. Several mods on the same hand can still be held together, for example J+K for ⇧⌘. Without the '*' exemption, holding Space for NAV and then pressing ⇧ on F, or Shift on F plus Tab, would count as a same-hand roll."}, {"name": "Flow Tap, with Shift exempt (the per-key rule is C)", "config": "#define FLOW_TAP_TERM 150\n// keymap.c (C)\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case LSFT_T(KC_F):\n    case RSFT_T(KC_J):\n      return 0;  // Shift: never force a tap\n  }\n  return (is_flow_tap_key(keycode) && is_flow_tap_key(prev_keycode)) ? FLOW_TAP_TERM : 0;\n}", "why": "If a home-row mod (or Space/NAV) is pressed within 150 ms of the previous letter, it is always a tap, so fast typing never fires a modifier and letters arrive without delay. Shift is exempt so capitals right after a space, and PascalCase such as HashMap, still work at full speed. Bspc/SYM, Tab/NUM and Enter/FUN aren't covered by Flow Tap by default, so a symbol right after a letter, as in foo(, is still instant."}, {"name": "Permissive Hold, plus Hold On Other Key Press for NUM (C)", "config": "#define TAPPING_TERM 200\n#define PERMISSIVE_HOLD\n#define HOLD_ON_OTHER_KEY_PRESS_PER_KEY\n// keymap.c (C)\nbool get_hold_on_other_key_press(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(1, KC_TAB);  // NUM thumb\n}", "why": "Permissive Hold lets a held layer or mod work as soon as you press and release another key inside it, so you don't have to wait 200 ms for each symbol. NUM also uses Hold On Other Key Press: if you let go of the thumb before the digit, you still get the digit and not Tab+letter, which in Slack would move focus. Space keeps plain Permissive Hold because you roll from Space into letters all the time."}, {"name": "Quick Tap Term", "config": "#define QUICK_TAP_TERM 120", "why": "Tap and then quickly hold a key to auto-repeat it: Bspc on the SYM thumb, or j in Vim, now that J is also Shift. A slower tap-then-hold still gives the modifier."}, {"name": "Tap-only combos (C)", "config": "COMBO_ENABLE = yes            # rules.mk\n#define COMBO_TERM 40\n#define COMBO_MUST_TAP_PER_COMBO\n// keymap.c (C)\nbool get_combo_must_tap(uint16_t index, combo_t *combo) { return true; }", "why": "Both combos use home-row mod keys. Tap-only means a held J+K or F+J falls through to the modifiers, so the combos never block ⇧⌘ or ⇧⇧ chords."}, {"name": "Caps Word", "config": "CAPS_WORD_ENABLE = yes        # rules.mk\n#define CAPS_WORD_IDLE_TIMEOUT 3000", "why": "Rust constants and enum-style identifiers are SCREAMING_SNAKE_CASE. Caps Word keeps going through _ (the SYM thumb) and digits, and stops by itself. You can turn it on from the F+J combo or the CapsW key on NAV."}, {"name": "Key override: Shift+; sends ? (C)", "config": "KEY_OVERRIDE_ENABLE = yes     # rules.mk\n// keymap.c (C)\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &shift_scln_ques };", "why": "Puts ? back on its QWERTY spot (Shift plus the bottom-right pinky key) for chat questions and Rust's ? operator, without using up a SYM slot. Shift+; was only a second copy of the : on the home row."}, {"name": "Layer Lock (already enabled)", "config": "LAYER_LOCK_ENABLE = yes       # rules.mk (already set)\nQK_LLCK on NUM (G) and MOUSE (B)", "why": "Lock NUM for long runs of numbers and MOUSE for long pointer sessions, without holding a thumb."}, {"name": "Remove Tap Dance", "config": "TAP_DANCE_ENABLE = no         # rules.mk; delete DANCE_0 and its handlers", "why": "⌘1 and ⌘2 (and ⌘3 to ⌘9) are now ⌘ plus a digit on NUM. The double-tap timing delay goes away, along with about 60 lines of generated C."}], "missing": ["F1-F12. There are none today, and VS Code needs F2 (rename), F12 (go to definition), F8 (next problem) and the debugger keys.", "Backspace on a thumb", "Shift on the home row (F and J)", "Modifiers on NAV, NUM, SYM, FUN and MOUSE (⇧/⌥/⌘+arrows, ⌘+digit, ⌘-click, ⌥-click to add a cursor)", "Caps Word for SCREAMING_SNAKE_CASE constants and acronyms", "Forward Delete", "Clipboard keys on NAV and MOUSE", "VS Code Back and Forward (⌃- and ⌃⇧-)", "Esc without leaving the home row (J+K)", "Tap-hold tuning (Chordal Hold, Flow Tap, Permissive Hold). Today everything runs on QMK defaults.", "Layer Lock for NUM", "Screenshot to the clipboard (⌃⌘⇧4), for pasting into chat"], "risks": ["This is a big relearn. Every thumb except Space changes its job, digits become a numpad, and SYM is new. Expect two to four weeks of slower typing, and longer before your symbol speed in Rust catches up.", "Esc is a combo now. It fires when you release J+K, and you have to press both within 40 ms. Years of reaching for a corner or thumb Esc will pull at you at first.", "Shift on the home row is new for you. Flow Tap is off for F and J on purpose, so that capitals work, which leaves those two protected only by Chordal Hold and Permissive Hold. A lingering index finger can produce a stray capital (in Vim normal mode, a stray O or J).", "Flow Tap on Space/NAV means you have to pause about 150 ms after a letter before holding Space for arrows. If you don't, you get a space.", "Enter shares its key with the FUN hold. If you let go of the thumb before the F-key during a quick FUN press, you get Enter plus a letter, which sends a chat message. Hold FUN deliberately, or move FUN somewhere else if it bites.", "Bspc shares its key with the SYM hold. If you let go of the thumb before the symbol key, you get Backspace plus a letter. It's harmless and easy to see, but it will happen while you learn.", "$ % ^ ~ now take three keys (⇧ plus a digit on NUM, or ⇧ plus ` on SYM).", "⌘⇧E, ⌘⇧H, the copy-path keys, ⌘1/⌘2 and ⌥Space lose their own keys and become home-row chords, so each takes one key more than today.", "In Vim, holding j to repeat now needs a tap first and then a hold, because J is Shift. Holding Space+J for repeated ↓ works too.", "Chordal Hold for the thumbs, per-key Flow Tap, tap-only combos and the key override all need custom C, which Oryx can't express. They live in this repo's custom QMK merge, and you need to check they survive each Oryx re-export.", "The mouse layer assumes your left hand is free for modifiers. If the Navigator is on the left half, ⌘-click still works, but you need to hold K (⌘) before moving the ball.", "The outer columns go dark. If that's too abrupt, put Esc, Bspc and Tab back in their old spots for two weeks as training wheels, then remove them.", "' is still on an outer column (one sideways pinky reach), on purpose."]}, "B": {"expert": "Expert B: pragmatic power user", "school": "Pragmatic 'keep what works' tuning: Getreuer's QMK tap-hold practice (Chordal Hold, scoped Flow Tap), Precondition's home-row-mods guide, r/ErgoMechKeyboards incrementalism, symbol placement from Rust frequency.", "summary": "This is a sound layout. It is QWERTY with a light set of home-row mods (no Shift on the index fingers), ':' unshifted on the home row (right for both Vim and Rust paths), and Space/Enter/Tab/Esc on the thumbs. So I keep every letter and thumb where it is and put the effort into firmware behaviour and the gaps. The worst problems are timing, not placement. The default quick-tap term turns ' {', ' &' and ' ->' (a space, then holding Space for a symbol) into a repeated space plus a letter, and does the same to Esc-then-Shift in Vim. With no permissive hold, a quick NAV chord can leak an Enter that sends a chat message. And switching on Flow Tap with its defaults would break snake_case, because it treats the Space thumb as a typing key. The functional gaps are no modifiers on NAV (so ⌥←, ⌘← and ⇧-selection are impossible), no F-keys anywhere, no ⌘-click on the mouse layer, mouse-layer KC_NO keys that silently eat the first letters typed after a click, and no reliable Shift+Enter. I fix these with mods on NAV in the same order as the base home-row mods, an FN tri-layer that mirrors the digits, a dedicated ⇧⏎, two Rust arrow macros and a Leader for the long tokens. Only eight existing keys change position.", "layers": [{"id": 0, "replaces": 0, "name": "Base", "activation": "default layer", "tap": [["Esc", "--", "--", "--", "--", "Lead", "CW", "--", "--", "--", "--", "⌃⌘⇧4"], ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Bspc"], ["OS⇧", "A", "S", "D", "F", "G", "H", "J", "K", "L", ":", "'"], ["Bspc", "Z", "X", "C", "V", "B", "N", "M", ",", ".", ";", "="], ["Space", "Enter", "Tab", "Esc"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "⌃", "⌥", "⌘", "", "", "", "", "⌘", "⌥", "⌃", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["SYM", "NAV", "NUM", "⇧"]], "cat": [["edit", "none", "none", "none", "none", "macro", "mod", "none", "none", "none", "none", "sys"], ["edit", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "edit"], ["mod", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym"], ["edit", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym", "sym", "sym"], ["edit", "edit", "edit", "edit"]], "changes": ["KEPT: every alpha, the ⌃⌥⌘ / ⌘⌥⌃ home-row mods with no Shift on F/J, ':' unshifted on the home-row pinky (right for Vim and for Rust '::' paths), ';' bottom-right, both Backspaces (the left one matters while your right hand is on the Navigator), both Tabs, and all four thumbs. This is muscle memory worth keeping.", "Top row (was all KC_NO apart from Esc): Leader above T, Caps Word above Y, and ⌃⌘⇧4 (screenshot to the clipboard, for pasting into Slack or an LLM chat) top-right. These are rare, harmless keys, so an overshoot from Esc or Bspc costs nothing. In Oryx put a placeholder such as F24 on the Leader key and map it to leader_start() in process_record_user (C), so an Oryx re-export can't overwrite it.", "Space/SYM thumb: quick-tap term set to 0 (C). With the default (200 ms), tapping Space and then holding it for a symbol repeats the space and types the base letter. That breaks ' {', ' &', ' ->', ' |x|', all very common in Rust (e.g. 'fn main() {' gives 'fn main()  j').", "Esc/⇧ thumb: quick-tap term 0 (C). Today, Esc followed by holding the same thumb for Shift (Vim '<Esc>A', '<Esc>O') repeats Esc and types a lowercase a/o.", "Enter/NAV and Tab/NUM thumbs: permissive hold on (C), so 'thumb down, tap J, thumb up' is ↓ and not 'Enter j'. That stray Enter is how a NAV chord sends a chat message today. The Enter thumb also gets a 175 ms tapping term: a hesitant press now sends nothing rather than Enter. Quick-tap is 0 on both.", "Home-row mods: Chordal Hold (thumbs exempt), Flow Tap 150 ms and permissive hold (C). Opposite-hand shortcuts such as K+C → ⌘C fire on the nested release with no 200 ms wait. Mid-word rolls can no longer turn into mods. Same-hand chords still need the hold you use today.", "Flow Tap is scoped to the home-row mods only (C). Its default treats the Space thumb as a typing key, which would force a space whenever you hold Space within 150 ms of a letter, so 'user_name' would come out as 'user hname'.", "Key override: ⇧ + ';' sends '?' (C). ';' sits where '/' was on ANSI, so Shift+that key gives '?' exactly where your fingers expect it, which helps in chat. Nothing is lost, because ':' already has its own key.", "Double-tap OSM⇧ turns on Caps Word (config.h), for SCREAMING_SNAKE consts and env vars. The top-row CW key is the visible fallback.", "Shift+Enter: OSM⇧ then Enter already works and stays. Holding ⇧ on R-outer while tapping Enter becomes reliable once permissive hold is on. There is a new dedicated ⇧⏎ on SYM + R-inner thumb (see SYM)."], "why": "The base already does the hard things right, so moving letters or thumbs would buy you weeks of relearning for little gain. The real damage comes from the default tap-hold timing on the thumbs: it eats ' {' after a space, Esc-then-Shift in Vim, and lets a quick NAV chord turn into a sent message. The changes are almost all firmware behaviour, plus three rare keys on the empty top row."}, {"id": 1, "replaces": 1, "name": "Numbers", "activation": "hold R-inner thumb (Tab)", "tap": [["", "", "", "", "", "", "", "", "", "", "", "--"], ["", "--", "--", "--", "--", "%", "^", "-", "+", "*", "/", ""], ["", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", ""], ["", "--", "--", "--", "--", "--", "0", "--", "", "", "", ""], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "FN", "", ""]], "cat": [["trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "none"], ["trns", "none", "none", "none", "none", "sym", "sym", "sym", "sym", "sym", "sym", "trns"], ["trns", "num", "num", "num", "num", "num", "num", "num", "num", "num", "num", "trns"], ["trns", "none", "none", "none", "none", "none", "num", "none", "trns", "trns", "trns", "trns"], ["trns", "trns", "trns", "trns"]], "changes": ["KP-, KP+, KP*, KP/ → plain -, +, *, / in the same positions. Keypad keycodes send different escape sequences when a terminal or Vim switches to application-keypad mode (you get stray 'Om'/'Ok' text or no-ops). The position is unchanged, only the keycode.", "MyComputer (top-right) → no key. That consumer code does nothing on macOS.", "KEPT: digits 1-0 along the home row, '%' '^' above 5/6, the extra '0' under N, and transparent ',' '.' '=' Bspc for decimals, ranges ('0..10') and arithmetic. All of this is good: Vim counts ('5j', ':42⏎') are thumb + home row.", "While NUM is held, also holding the L-inner thumb (NAV) opens the new FN layer (tri-layer, C). Tapping L-inner still gives Enter, so ':42⏎' works without letting go of NUM.", "F-keys deliberately not here: they live on FN in the same positions as the digits, so 'F2 is where 2 is'."], "why": "This layer was already right ergonomically, with digits on the home row under a held thumb. The fix is the keypad keycodes, which misbehave in exactly the tools you use (terminal Vim, tmux). Nothing moves, so there is no relearning."}, {"id": 2, "replaces": 2, "name": "Symbols", "activation": "hold L-outer thumb (Space)", "tap": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "!", "@", "[", "]", "%", "^", "-", "+", "*", "\\", ""], ["", "?", "&", "<", ">", "#", "_", "{", "}", "|", "/", "\""], ["", "~", "`", "(", ")", "$", "->", "=>", "", "", "", ""], ["", "", "⇧⏎", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "trns"], ["trns", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym"], ["trns", "sym", "sym", "sym", "sym", "sym", "macro", "macro", "trns", "trns", "trns", "trns"], ["trns", "trns", "edit", "trns"]], "changes": ["'/' ↔ '\\' swapped: '/' moves from the right-pinky top row to the right-pinky home row (the old '\\' slot), and '\\' goes up to P. '/' is the busiest symbol here for you: '//' and '///' doc comments in Rust, '/' search in Vim, paths and URLs in chat. '\\' is close to unused in Rust. Same finger, one row, so it's cheap to relearn. On NUM, '/' stays on P next to - + *.", "N: stray '0' (copied from NUM; nobody types 0 from the symbol layer) → '->' macro. M: empty → '=>' macro. Return types and match arms are on almost every screen of Rust. Both are now one key under the index finger, with no cross-hand '-' then '>' and no pinky trip to '='.", "R-inner thumb (was transparent Tab/NUM) → ⇧⏎. Hold Space and tap the right inner thumb for a newline in Slack or an LLM chat. It is a plain key, so it fires on press. If you roll it too fast the result is Space+Tab, never a sent message.", "KEPT: '_' on H (snake_case), '{' '}' on J K, '<' '>' on D F, '(' ')' on C V, '?' '&' '#' '|' '\"' '!' '@' '[' ']' '`' '~' '$' '%' '^' '-' '+' '*'. These are already in good frequency order for Rust. Same-hand thumb+finger symbols are fine because the thumb moves independently, so I don't mirror the layer the way a minimalist would.", "'::' deliberately not a macro: two taps on the home-row ':' are already as fast as one layer chord."], "why": "Your symbol layer already puts Rust's heavy hitters (_ {} <> () & ?) on or near the home row, so I only fix two clear misallocations: '/' on a weak key while '\\' wastes a home-row slot, and a stray '0'. I also add the two Rust tokens that really cost effort, plus a safe Shift+Enter. Nothing you type often moves except '/', and it moves one row on the same finger."}, {"id": 3, "replaces": 3, "name": "Nav / IDE / media", "activation": "hold L-inner thumb (Enter)", "tap": [["", "", "⌃⇧G", "⌘⇧F", "⌘⇧H", "", "", "", "", "", "", ""], ["", "⌘.", "⌘\\", "⌘⇧[", "⌘⇧]", "⌘↓", "⌥P", "⌥H", "⌥L", "⌥N", "Play", "Del"], ["", "⌃", "⌥", "⌘", "⇧", "⌘⇧E", "←", "↓", "↑", "→", "Vol-", "Vol+"], ["⌥Spc", "⌥⌘⇧C", "⌥⌘C", "⌘1/2", "⌃`", "⌘⇧P", "Home", "PgDn", "PgUp", "End", "Mute", "⌘⇧4"], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "FN", ""]], "cat": [["trns", "trns", "ide", "ide", "ide", "trns", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "media", "edit"], ["trns", "mod", "mod", "mod", "mod", "ide", "nav", "nav", "nav", "nav", "media", "media"], ["sys", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "media", "sys"], ["trns", "trns", "trns", "trns"]], "changes": ["Left home row → plain ⌃ ⌥ ⌘ ⇧ on A S D F, the same order as the base home-row mods plus ⇧ on the index finger. Selection and jumps become one-handed chords: ⌥←/⌥→ by word, ⌘←/⌘→ to line start/end in Mac-native apps where Home/End only scroll, ⇧+arrows to select, ⌥⇧→ to select a word, ⌘⇧↑ to select to the top. Holding D and tapping the R-inner thumb gives ⌘Tab. Today none of this is possible, because ⌘/⌥ live under the arrows. Colour these four keys green like the base mods.", "The three VS Code search keys displaced from the home row keep their columns and move up two rows: ⌃⇧G (Source Control) above S, ⌘⇧F (search in files) above D, ⌘⇧H (replace in files) above F. ⌘⇧E (Explorer) stays on G. This is the main relearn in the whole proposal.", "Q (was empty) → ⌘. (Quick Fix: rust-analyzer imports, fill match arms). B (was empty) → ⌘⇧P (command palette).", "Media Stop (top-right) → Del (forward delete), on the Backspace position so it reads 'Backspace, but forward'. Most macOS players ignore Stop, and a Mac has no forward delete without fn. ⌥ on S + Del deletes a word forward.", "KEPT: vim arrows on HJKL with Home/PgDn/PgUp/End under them, ⌘\\ split, ⌘⇧[ ] tab switching, ⌘↓, copy-path keys, the ⌘1/⌘2 tap dance, ⌃` terminal, ⌥Space launcher, Play, volume, Mute, ⌘⇧4. Those are your choices and they're good.", "KEPT on Right Option: the tmux keys ⌥P/⌥H/⌥L/⌥N. If they work today, your terminal already treats Right Option as Meta. If you ever switch terminals and they print '˙' or 'π', change the four keycodes to LALT.", "R-inner thumb held while NAV is held → FN layer (tri-layer, C)."], "why": "The single biggest functional gap in the layout is that NAV has arrows but no modifiers, which is crippling for editing text in Slack or an LLM chat box. Putting the mods where your fingers already expect ⌃⌥⌘ fixes it with almost no learning. Every existing VS Code and tmux shortcut survives, and three of them shift up in their own columns."}, {"id": 4, "replaces": 4, "name": "Mouse", "activation": "automouse: move the Navigator (750 ms timeout); LLock pins it", "tap": [["", "", "", "LLock", "CPI-", "CPI+", "", "", "", "", "", ""], ["", "", "", "", "", "", "BTN1", "BTN3", "BTN2", "", "", ""], ["⇧", "", "", "", "Drag", "TogScr", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "⌃", "⌥", "⌘", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["trns", "trns", "trns", "mouse", "mouse", "mouse", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "trns", "trns", "trns", "trns", "trns", "mouse", "mouse", "mouse", "trns", "trns", "trns"], ["mod", "trns", "trns", "trns", "mouse", "mouse", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "trns", "trns", "trns"]], "changes": ["Every unused key: KC_NO → transparent. In this firmware's auto-mouse code, KC_NO is on the 'skip' list. A letter you type within 750 ms of a click is silently eaten, and the layer stays on and eats the next one too. Transparent keys type normally and end the layer, so 'click the chat box, start typing' just works.", "⌘/⌥/⌃-click: hold the normal home-row mod (D, S, A), which now shows through. Auto-mouse ignores a mod-tap while it is held, so the layer stays up for the click. Chordal Hold allows it because the buttons are on the other hand. Use ⌘-click for go to definition and links in new tabs, and ⌥-click for VS Code multi-cursor. I did not use plain mods here: they would swallow an 'a', 's' or 'd' typed right after a click.", "Left outer home key (OSM⇧ position) → a plain held ⇧, for Shift-click range selection and Shift-drag. A one-shot can't be held through a click or drag.", "LLock (was C) and CPI-/CPI+ (were V/B, same columns) move to the top row. That frees Z X C V, so D(⌘)+Z/X/C/V gives undo/cut/copy/paste without leaving the pointer. These are rare keys, and the top row is never hit by accident while typing.", "KEPT: BTN1/BTN3/BTN2 on Y U I, drag-scroll on F, toggle-scroll on G, and the 750 ms timeout."], "why": "Most mouse-layer pain today comes from KC_NO: lost keystrokes after every click, and no modifiers. Making the layer transparent fixes both at once and reuses the home-row mods you already know. The click and scroll keys you use stay exactly where they are."}, {"id": 5, "replaces": null, "name": "FN / system", "activation": "hold both inner thumbs (Enter/NAV + Tab/NUM): tri-layer (C)", "tap": [["Boot", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "Lock"], ["--", "RGB", "Bri-", "Bri+", "--", "--", "--", "--", "--", "--", "--", "--"], ["F11", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F12"], ["⇧F11", "--", "--", "--", "--", "⇧F5", "--", "--", "⇧F8", "--", "--", "⇧F12"], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "NAV", "NUM", ""]], "cat": [["sys", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "sys"], ["none", "sys", "sys", "sys", "none", "none", "none", "none", "none", "none", "none", "none"], ["fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn"], ["ide", "none", "none", "none", "none", "ide", "none", "none", "ide", "none", "none", "ide"], ["trns", "trns", "trns", "trns"]], "changes": ["NEW. F1-F10 sit exactly where 1-0 are on NUM. F11 and F12 take the two outer home keys. VS Code: F2 rename (S), F12 go to definition (right outer), F8 next problem (K), F5 start/continue debug (G), F9 breakpoint (L), F10 step over, F11 step into.", "Bottom row = the shifted F-key above it: ⇧F5 stop debugging, ⇧F8 previous problem, ⇧F11 step out, ⇧F12 find references. Both thumbs are busy here, so the shifted versions need their own keys.", "System corner keys you need rarely and must never hit by accident: Boot (bootloader, for flashing) top-left, Lock (⌃⌘Q, lock screen) top-right, RGB on/off and LED brightness on the left.", "Build it as layer 5 in Oryx (it exports the keys and LEDs). The only custom C is the activation, update_tri_layer_state(state, 1, 3, 5)."], "why": "The layout had no F-keys at all, and they are the fastest route to rename, go to definition, next problem and the debugger in VS Code. A tri-layer keeps them on the home row under both thumbs, numbered exactly like your digits, without stealing a key or a thumb from anything else."}], "combos": [{"keys": "L-outer + L-inner thumbs (Space + Enter), pressed together", "output": "⇧⏎", "why": "Optional one-motion newline: roll the left thumb flat across both keys, so Enter alone sends and the 'fat' press makes a newline. If it fires by accident (a trailing space rolled into Enter) you get a newline, never a send. I add no combos on letter keys: with home-row mods, Chordal Hold and Flow Tap already in play, alpha combos are the next misfire source (for example ',+.' would fire on 'e.g.,'). Oryx supports thumb combos. Use COMBO_TERM 40."}], "macros": [{"label": "->", "sends": "->", "why": "SYM + N. On almost every fn signature and closure return type. It replaces a cross-hand '-' (U) then '>' (F)."}, {"label": "=>", "sends": "=>", "why": "SYM + M. On every match arm. It replaces a pinky stretch to '=' followed by '>'."}, {"label": "Lead m", "sends": "&mut ", "why": "The most common Rust token that isn't a single symbol. (C)"}, {"label": "Lead s", "sends": "&mut self", "why": "Nine characters for a mutating method signature. (C)"}, {"label": "Lead d", "sends": "#[derive(Debug, Clone)]", "why": "23 characters, typed on most struct/enum definitions. Edit it to your usual derive set. (C)"}, {"label": "Lead t", "sends": "#[test]", "why": "Unit tests. (C)"}, {"label": "Lead c", "sends": "#[cfg(test)]", "why": "The test module header. (C)"}, {"label": "Lead u", "sends": ".unwrap()", "why": "Prototyping and tests. (C)"}, {"label": "Lead e", "sends": ".expect(\"\") then ←← (cursor between the quotes)", "why": "Lands you ready to type the message. Works with or without editor auto-pairs, because VS Code and nvim-autopairs type over the auto-inserted closers. (C)"}, {"label": "Lead o", "sends": "Ok(())", "why": "Four shifted bracket chords on SYM become one sequence. (C)"}, {"label": "Lead p", "sends": "println!(\"{:?}\", ); then ←← (cursor before ')')", "why": "Debug printing. 20 characters, a third of them shifted symbols. (C)"}], "features": [{"name": "Tap-hold baseline (config.h)", "config": "#define TAPPING_TERM 200\n#define TAPPING_TERM_PER_KEY\n#define PERMISSIVE_HOLD_PER_KEY\n#define QUICK_TAP_TERM 120\n#define QUICK_TAP_TERM_PER_KEY", "why": "This keeps today's 200 ms feel and switches on the per-key callbacks below. Leave RETRO_TAPPING and HOLD_ON_OTHER_KEY_PRESS off: either one would make the Enter thumb fire (or turn into NAV) in situations where it doesn't today. Don't also set per-key tapping terms in Oryx, or the callbacks will be defined twice."}, {"name": "Per-key tap-hold callbacks (C)", "config": "uint16_t get_tapping_term(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(3, KC_ENTER) ? 175 : TAPPING_TERM; // Enter must be a crisp tap\n}\nbool get_permissive_hold(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE):          // prose safety: a lingering Space thumb must stay a space\n    case MT(MOD_RSFT, KC_ESCAPE):  // Vim safety: Esc rolled into j must not become ⇧J\n      return false;\n    default:\n      return true;                 // home-row mods (guarded by Chordal Hold + Flow Tap), Enter/NAV, Tab/NUM\n  }\n}\nuint16_t get_quick_tap_term(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE): case LT(3, KC_ENTER): case LT(1, KC_TAB): case MT(MOD_RSFT, KC_ESCAPE):\n      return 0;                    // tap-then-hold on a thumb always means the layer or mod, never auto-repeat\n    default:\n      return QUICK_TAP_TERM;       // keeps tap-then-hold repeat on the home-row keys (kkkk in Vim)\n  }\n}", "why": "Each line removes one misfire this user hits daily. ' {' and ' &' after a space; Esc→⇧ in Vim; 'Enter j' from a quick NAV chord. It also makes opposite-hand ⌘/⌃ shortcuts fire without waiting out the 200 ms."}, {"name": "Chordal Hold, thumbs exempt (C)", "config": "// config.h\n#define CHORDAL_HOLD\n// keymap.c\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n                    '*','*',  '*','*'\n);", "why": "A same-hand roll on a home-row mod (D then C mid-word) settles as letters immediately. The thumbs must be '*': Chordal Hold settles a same-hand press as a tap on the spot, which would otherwise break Space + left-hand symbols, NUM + right-hand digits and the FN tri-layer. The ':'/⌃ key (DUAL_FUNC_0 is really LT(3, KC_X)) is covered automatically."}, {"name": "Flow Tap on home-row mods only (C)", "config": "// config.h\n#define FLOW_TAP_TERM 150\n// keymap.c\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case MT(MOD_LCTL, KC_A): case MT(MOD_LALT, KC_S): case MT(MOD_LGUI, KC_D):\n    case MT(MOD_RGUI, KC_K): case MT(MOD_RALT, KC_L): case DUAL_FUNC_0:\n      return is_flow_tap_key(prev_keycode) ? FLOW_TAP_TERM : 0;\n    default:\n      return 0; // never on thumbs\n  }\n}", "why": "A home-row mod pressed within 150 ms of a letter is always a letter, which removes fast-typing mod misfires. The default get_flow_tap_term also applies to LT(2, KC_SPACE) because its tap is KC_SPC. That would force a space whenever you hold Space within 150 ms of a letter, so snake_case and 'foo(' would break. Hence the explicit scope. It already turns itself off while ⌘/⌃/⌥ is held."}, {"name": "Key override ⇧; → ? (C)", "config": "# rules.mk\nKEY_OVERRIDE_ENABLE = yes\n// keymap.c\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &shift_scln_ques };", "why": "This puts '?' back on Shift + the key right of '.', where every ANSI typist looks for it. That matters in chat. The ':' key and SEND_STRING macros are unaffected, because neither goes through KC_SCLN key events."}, {"name": "Caps Word on double-tap Shift", "config": "# rules.mk\nCAPS_WORD_ENABLE = yes\n// config.h\n#define DOUBLE_TAP_SHIFT_TURNS_ON_CAPS_WORD", "why": "This works with your OSM(MOD_LSFT). Caps Word is already compiled in (keyboard.json) but had no trigger. Use it for SCREAMING_SNAKE consts, statics and env vars. '_' keeps it going, so MAX_RETRY_COUNT is one go."}, {"name": "Leader with instant single-key sequences (C)", "config": "# rules.mk\nLEADER_ENABLE = yes\n// config.h\n#define LEADER_NO_TIMEOUT\n// keymap.c  (Oryx key = KC_F24 placeholder)\n// in process_record_user: case KC_F24: if (record->event.pressed) leader_start(); return false;\nbool leader_add_user(uint16_t keycode) { return true; } // every sequence is one key: fire immediately\nvoid leader_end_user(void) {\n  if      (leader_sequence_one_key(KC_M)) SEND_STRING(\"&mut \");\n  else if (leader_sequence_one_key(KC_S)) SEND_STRING(\"&mut self\");\n  else if (leader_sequence_one_key(KC_D)) SEND_STRING(\"#[derive(Debug, Clone)]\");\n  else if (leader_sequence_one_key(KC_T)) SEND_STRING(\"#[test]\");\n  else if (leader_sequence_one_key(KC_C)) SEND_STRING(\"#[cfg(test)]\");\n  else if (leader_sequence_one_key(KC_U)) SEND_STRING(\".unwrap()\");\n  else if (leader_sequence_one_key(KC_E)) SEND_STRING(\".expect(\\\"\\\")\" SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n  else if (leader_sequence_one_key(KC_O)) SEND_STRING(\"Ok(())\");\n  else if (leader_sequence_one_key(KC_P)) SEND_STRING(\"println!(\\\"{:?}\\\", );\" SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n}", "why": "This is Vim-style <leader> for the long Rust tokens, without spending prime keys on them. leader_add_user returning true fires on the first key, so there is no timeout lag. Leader resolves home-row mod-taps to their letters, so 's' and 'd' work. Any other key after Lead (Esc, say) just cancels."}, {"name": "FN tri-layer (C)", "config": "layer_state_t layer_state_set_user(layer_state_t state) {\n  return update_tri_layer_state(state, 1, 3, 5); // NUM + NAV → FN\n}", "why": "Holding both inner thumbs (you never hold them together for anything else today) opens F-keys on the home row. Layer 5 fits under LAYER_STATE_8BIT and sits above the automouse layer 4. Define the layer's keys and colours in Oryx. This function is the only code."}], "missing": ["F-keys: there were none anywhere. Now F1-F12 plus ⇧F5/⇧F8/⇧F11/⇧F12 on FN, numbered like your digits.", "Modifiers on NAV: ⌥←/⌥→ word jumps, ⌘←/⌘→ line ends, ⇧-selection and ⌘Tab were impossible.", "Modifier-clicks on the mouse layer: ⌘-click (go to definition, open link in a new tab), ⌥-click (multi-cursor) and ⇧-click (range select).", "Keystrokes typed right after a click were silently eaten by KC_NO on the mouse layer.", "A dedicated, send-proof Shift+Enter (SYM + R-inner thumb, plus an optional thumb combo).", "Tap-hold safety config: no Chordal Hold, Flow Tap, permissive hold or quick-tap tuning, so ' {' after a space, Esc→⇧ in Vim and quick NAV chords misfired.", "A Caps Word trigger, though Caps Word is already compiled in.", "Rust token shortcuts: '->' and '=>' keys, Leader snippets for &mut, derive, test, cfg(test), unwrap, expect, Ok(()), println!.", "VS Code Quick Fix (⌘.) and the command palette (⌘⇧P) on NAV.", "Forward Delete.", "'?' on Shift + the old '/' key (ANSI position).", "Screenshot to the clipboard (⌃⌘⇧4) for pasting into chats.", "Bootloader, RGB and lock-screen keys."], "risks": ["Chordal Hold does not make same-hand shortcuts faster. D(⌘)+C still needs the >200 ms hold you use today. Opposite-hand ones (K+C, K+V, K+Z, ':'-key+C for ⌃C) become instant, so lean on those.", "Permissive hold on the home-row mods leaves one residual misfire. Start a word slowly after a pause of more than 150 ms with a lingering pinky ('a' still down while 'n' goes down and up) and you get ⌃N. Flow Tap only covers mid-word rolls. If it bites, return false from get_permissive_hold for A and the ':' key only.", "The Space thumb deliberately gets no permissive hold and no Flow Tap. '_' and the other symbols still need Space held a moment before you release the symbol key, as today. The win is that ' {', ' &' and ' ->' right after a space now work every time.", "Quick-tap 0 on the thumbs removes hold-to-repeat for Space, Enter, Tab and Esc. Backspace is a plain key and still repeats.", "Enter has a 175 ms tapping term, so a slow, hesitant Enter sends nothing. That is the point, but you may notice it for a day. One stray-Enter path remains: a very fast roll where the thumb comes up before the arrow key. If it still happens, enable hold-on-other-key-press for that one key, at the cost of Enter-then-letter rolls in code turning into NAV.", "NAV relearn: ⌃⇧G, ⌘⇧F and ⌘⇧H move up two rows. Expect about a week of reaching for the home row.", "The '/' ↔ '\\' swap breaks the mirror between SYM's and NUM's operator rows. On NUM, '/' stays on P.", "Mouse layer: typing right after a click now types, but y, u and i are still mouse buttons for 750 ms. A tap on the left outer key there is a plain Shift, so a capital typed straight after a click can come out lowercase.", "Leader snippets run as commands if you fire them in Vim normal mode. Use them in insert mode only.", "Several pieces are custom C (tap-hold callbacks, chordal layout, Flow Tap scope, key override, Leader, tri-layer). They live outside the Oryx keymap array, so re-exports merge cleanly, but a change in Oryx to the same keycodes (for example renaming DUAL_FUNC_0) needs a matching edit.", "macOS maps F11 to Show Desktop. Turn that off (System Settings → Keyboard → Keyboard Shortcuts → Mission Control) to get VS Code step-into back.", "The optional Space+Enter thumb combo depends on how comfortably your thumb covers both keys. If it feels awkward, skip it, because SYM + R-inner already gives ⇧⏎."]}, "meta": {"lede": "Your five layers next to two independent redesigns, one from the ergonomic-minimalist school (A) and one from the pragmatic Rust/Vim school (B). Keys outlined in pink differ from your current layout.", "introHTML": "\n<div class=\"grid2\">\n  <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div class=\"eyebrow\">How I read your layout<\/div>\n    <h2>What you built, and why it mostly works<\/h2>\n    <ul><li><b>Base:<\/b> QWERTY with ⌃⌥⌘ home-row mods on A S D and K L ;, and nothing on F or J. Keeping Shift off the home row was a sensible way to avoid stray capitals. You moved <code>:<\/code> to the home-row pinky (unshifted, for Vim and Rust <code>::<\/code>) and pushed <code>;<\/code> down. The number row is left blank on purpose.<\/li><li><b>LEDs:<\/b> green outlines the frame and modifiers and blue marks typing keys. Each layer has its own palette: pink digits, yellow symbols with purple bracket pairs, teal VS Code keys, red arrows. The colours on the diagrams below follow the same scheme.<\/li><li><b>NUM<\/b> puts the digits along the home row. <b>SYM<\/b> stacks three bracket pairs under the left index and middle fingers. <b>NAV<\/b> has a VS Code panel cluster on the left, Vim arrows on HJKL and media on the right pinky. <b>Mouse<\/b> is automouse, with the buttons on Y U I.<\/li><\/ul>\n  <\/div>\n  <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div class=\"eyebrow\">Problems I found (both experts agree)<\/div>\n    <h2>What's broken or missing<\/h2>\n    <ul><li><b>Tap-hold timing is on QMK defaults.<\/b> If you tap Space and then hold it straight away for a symbol, QMK auto-repeats Space instead, so <code>fn main() {{<\/code> comes out as <code>fn main()  j<\/code>. A quick NAV chord can leak an <b>Enter<\/b> and send a half-typed chat message. Home-row mods have no Chordal Hold or Flow Tap protection.<\/li><li><b>NAV has no modifiers<\/b>, so ⌥← word jump, ⌘← line start and ⇧-arrow selection are all awkward. For chat and editing, this is the biggest gap.<\/li><li><b>The mouse layer swallows keystrokes.<\/b> Its unused keys are <code>KC_NO<\/code>, which QMK's auto-mouse code skips. A letter typed within 750 ms of moving the ball is lost and the layer stays on. I checked this in the firmware source. There is also no ⌘-click for go to definition.<\/li><li><b>No F-keys at all.<\/b> VS Code and rust-analyzer need F2 (rename), F12 (go to definition), F8 (next problem) and F5/F9/F10/F11 (debugging).<\/li><li><b>NUM uses keypad keycodes<\/b> (<code>KC_KP_MINUS<\/code> and so on), which send different codes in terminal Vim when application-keypad mode is on. The <code>MyComputer<\/code> key does nothing on macOS.<\/li><li>Caps Word is already compiled into the firmware but has no trigger. It's useful for <code>SCREAMING_SNAKE<\/code> constants.<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"grid2\" style=\"margin-top:16px\">\n  <div class=\"op A\"><div class=\"who\"><span class=\"tag tA\">A<\/span><h3>Expert A — ergonomic minimalist<\/h3><\/div><p class=\"eyebrow\" style=\"text-transform:none;letter-spacing:0\">Miryoku-style 3x5 + thumbs (Manna Harbour), Callum&#x27;s modifiers on every layer, Pascal Getreuer&#x27;s tap-hold tuning (Chordal Hold, Flow Tap), Seniply&#x27;s Extend-layer conventions, Ben Vallack&#x27;s small-footprint discipline<\/p><p class=\"why\">Your layout gets several things right already: home-row mods, Vim arrows on HJKL, an unshifted :, and an empty number row. The problem is where the busiest keys live. Backspace sits on two outer pinky keys, and Shift is either an outer pinky key or a thumb hold shared with Esc. SYM is held by the same hand that types half its symbols, and NAV, NUM and MOUSE have no modifiers, so selecting text, ⌘+digit and ⌘-click all mean holding a modifier first. I rebuild it as a Miryoku-style 3x5 core plus four thumbs: Space/NAV and Tab/NUM on the left, Enter/FUN and Backspace/SYM on the right. Each layer&#x27;s keys sit under the opposite hand, the same ⌃⌥⌘⇧ home row repeats on every layer, and the outer columns go dark apart from &#x27;. Chordal Hold, Flow Tap and Permissive Hold make the home-row mods (now with Shift) safe at speed, and F-keys, Caps Word, Del and clipboard keys fill the gaps. No typed-text macros are needed, because -&gt; and =&gt; are already two-tap rolls.<\/p><\/div>\n  <div class=\"op B\"><div class=\"who\"><span class=\"tag tB\">B<\/span><h3>Expert B: pragmatic power user<\/h3><\/div><p class=\"eyebrow\" style=\"text-transform:none;letter-spacing:0\">Pragmatic &#x27;keep what works&#x27; tuning: Getreuer&#x27;s QMK tap-hold practice (Chordal Hold, scoped Flow Tap), Precondition&#x27;s home-row-mods guide, r/ErgoMechKeyboards incrementalism, symbol placement from Rust frequency.<\/p><p class=\"why\">This is a sound layout. It is QWERTY with a light set of home-row mods (no Shift on the index fingers), &#x27;:&#x27; unshifted on the home row (right for both Vim and Rust paths), and Space/Enter/Tab/Esc on the thumbs. So I keep every letter and thumb where it is and put the effort into firmware behaviour and the gaps. The worst problems are timing, not placement. The default quick-tap term turns &#x27; {&#x27;, &#x27; &amp;&#x27; and &#x27; -&gt;&#x27; (a space, then holding Space for a symbol) into a repeated space plus a letter, and does the same to Esc-then-Shift in Vim. With no permissive hold, a quick NAV chord can leak an Enter that sends a chat message. And switching on Flow Tap with its defaults would break snake_case, because it treats the Space thumb as a typing key. The functional gaps are no modifiers on NAV (so ⌥←, ⌘← and ⇧-selection are impossible), no F-keys anywhere, no ⌘-click on the mouse layer, mouse-layer KC_NO keys that silently eat the first letters typed after a click, and no reliable Shift+Enter. I fix these with mods on NAV in the same order as the base home-row mods, an FN tri-layer that mirrors the digits, a dedicated ⇧⏎, two Rust arrow macros and a Leader for the long tokens. Only eight existing keys change position.<\/p><\/div>\n<\/div>\n<p style=\"margin-top:12px;font-size:13.5px;color:var(--muted)\">Where the two opinions came from: two independent AI reviewers worked separately from the same brief, each told to argue from one established school of layout design. They are not human experts. I checked their firmware claims against ZSA's firmware 25 source and added notes where I disagree.<\/p>\n", "layerNotes": {"0": "Both experts keep QWERTY, your ⌃⌥⌘ order and <code>:<\/code> on the home row. A moves Backspace to a thumb, adds Shift on F and J, and turns Esc into a J+K combo. B keeps all four thumbs and fixes their timing. <b>My note:<\/b> both add the same key override, so ⇧+; gives <code>?<\/code> where QWERTY fingers expect it.", "1": "Both replace the keypad operators with plain ones and remove MyComputer. A rebuilds NUM as a right-hand numpad held by the left thumb, with modifiers under the left fingers, which makes ⌘1–⌘9 easy. B leaves the digits where they are. <b>My note on A:<\/b> its <code>HOLD_ON_OTHER_KEY_PRESS<\/code> on the Tab/NUM thumb turns a fast Tab-then-letter roll (accepting a completion and carrying on typing) into a digit. I'd drop that setting.", "2": "Both keep <code>_ { } &lt; &gt; ( )<\/code> close to home. A moves every symbol to the left hand and holds the layer with the right thumb (Bspc). B keeps your placement, swaps <code>/<\/code> and <code>\\<\/code>, and adds <code>-&gt;<\/code> and <code>=&gt;<\/code> keys plus a ⇧⏎ key for chat. <b>My note on A:<\/b> <code>#<\/code> is only on NUM, so typing <code>#[derive(..)]<\/code> means switching layers in the middle of the token. Put <code>#<\/code> on a free SYM key.", "3": "Both put plain ⌃⌥⌘⇧ on NAV's left home row and keep your HJKL arrows and tmux keys. A also adds ⌘Z/X/C/V, VS Code Back and Forward, and Del, and turns the letter-based shortcuts into home-row chords. B keeps every shortcut you have, moves three of them up two rows, and adds ⌘. (Quick Fix), ⌘⇧P and Del.", "4": "Both add modifier-clicks. <b>My note on A:<\/b> its unused mouse-layer keys are still <code>KC_NO<\/code>, so the keystroke-swallowing bug is still there. Make them transparent, as B does. Its plain mods on A S D F will also swallow those letters if you type them within 750 ms of a click. B avoids this by letting your home-row mod-taps show through.", "5": "There are no F-keys in your current layout. A puts them behind the R-inner thumb (Enter) in a 789/456/123 block. B uses a tri-layer, holding both inner thumbs, with F1–F10 exactly where 1–0 are, so F2 is where 2 is."}, "newNotes": ["There are no F-keys in your current layout. A puts them behind the R-inner thumb (Enter) in a 789/456/123 block. B uses a tri-layer, holding both inner thumbs, with F1–F10 exactly where 1–0 are, so F2 is where 2 is."], "outroHTML": "\n<section class=\"layer\" id=\"features\">\n  <div class=\"eyebrow\">Firmware features<\/div>\n  <h2>QMK features each expert turns on<\/h2>\n  <p>Both experts turn on <b>Chordal Hold<\/b> (with the thumbs exempt), <b>Flow Tap<\/b>, <b>Permissive Hold<\/b>, <b>Caps Word<\/b> and the <b>⇧; → ?<\/b> key override. They disagree on scope. B keeps Flow Tap off the Space thumb, because with Space as the SYM key, Flow Tap would break <code>user_name<\/code>. A puts Flow Tap on Space/NAV, which is safe there because Space doesn't hold SYM in A's layout.<\/p>\n  <div class=\"opinions\">\n    <div class=\"op A\"><h3>Expert A: features<\/h3><ul><li><b>Chordal Hold, with thumbs exempt (the exemption is C)<\/b>: A home-row mod pressed with another key on the same hand types as a letter, which removes most rolling misfires such as &#x27;as&#x27; turning into ⌃s. Several mods on the same hand can still be held together, for example J+K for ⇧⌘. Without the &#x27;*&#x27; exemption, holding Space for NAV and then pressing ⇧ on F, or Shift on F plus Tab, would count as a same-hand roll.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>#define CHORDAL_HOLD\n// keymap.c (C): mark the thumbs &#x27;*&#x27; so the layer thumbs can chord with either hand\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n                 &#x27;*&#x27;,&#x27;*&#x27;,  &#x27;*&#x27;,&#x27;*&#x27;);<\/pre><\/details><\/li><li><b>Flow Tap, with Shift exempt (the per-key rule is C)<\/b>: If a home-row mod (or Space/NAV) is pressed within 150 ms of the previous letter, it is always a tap, so fast typing never fires a modifier and letters arrive without delay. Shift is exempt so capitals right after a space, and PascalCase such as HashMap, still work at full speed. Bspc/SYM, Tab/NUM and Enter/FUN aren&#x27;t covered by Flow Tap by default, so a symbol right after a letter, as in foo(, is still instant.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>#define FLOW_TAP_TERM 150\n// keymap.c (C)\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case LSFT_T(KC_F):\n    case RSFT_T(KC_J):\n      return 0;  // Shift: never force a tap\n  }\n  return (is_flow_tap_key(keycode) &amp;&amp; is_flow_tap_key(prev_keycode)) ? FLOW_TAP_TERM : 0;\n}<\/pre><\/details><\/li><li><b>Permissive Hold, plus Hold On Other Key Press for NUM (C)<\/b>: Permissive Hold lets a held layer or mod work as soon as you press and release another key inside it, so you don&#x27;t have to wait 200 ms for each symbol. NUM also uses Hold On Other Key Press: if you let go of the thumb before the digit, you still get the digit and not Tab+letter, which in Slack would move focus. Space keeps plain Permissive Hold because you roll from Space into letters all the time.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>#define TAPPING_TERM 200\n#define PERMISSIVE_HOLD\n#define HOLD_ON_OTHER_KEY_PRESS_PER_KEY\n// keymap.c (C)\nbool get_hold_on_other_key_press(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(1, KC_TAB);  // NUM thumb\n}<\/pre><\/details><\/li><li><b>Quick Tap Term<\/b>: Tap and then quickly hold a key to auto-repeat it: Bspc on the SYM thumb, or j in Vim, now that J is also Shift. A slower tap-then-hold still gives the modifier.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>#define QUICK_TAP_TERM 120<\/pre><\/details><\/li><li><b>Tap-only combos (C)<\/b>: Both combos use home-row mod keys. Tap-only means a held J+K or F+J falls through to the modifiers, so the combos never block ⇧⌘ or ⇧⇧ chords.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>COMBO_ENABLE = yes            # rules.mk\n#define COMBO_TERM 40\n#define COMBO_MUST_TAP_PER_COMBO\n// keymap.c (C)\nbool get_combo_must_tap(uint16_t index, combo_t *combo) { return true; }<\/pre><\/details><\/li><li><b>Caps Word<\/b>: Rust constants and enum-style identifiers are SCREAMING_SNAKE_CASE. Caps Word keeps going through _ (the SYM thumb) and digits, and stops by itself. You can turn it on from the F+J combo or the CapsW key on NAV.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>CAPS_WORD_ENABLE = yes        # rules.mk\n#define CAPS_WORD_IDLE_TIMEOUT 3000<\/pre><\/details><\/li><li><b>Key override: Shift+; sends ? (C)<\/b>: Puts ? back on its QWERTY spot (Shift plus the bottom-right pinky key) for chat questions and Rust&#x27;s ? operator, without using up a SYM slot. Shift+; was only a second copy of the : on the home row.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>KEY_OVERRIDE_ENABLE = yes     # rules.mk\n// keymap.c (C)\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &amp;shift_scln_ques };<\/pre><\/details><\/li><li><b>Layer Lock (already enabled)<\/b>: Lock NUM for long runs of numbers and MOUSE for long pointer sessions, without holding a thumb.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>LAYER_LOCK_ENABLE = yes       # rules.mk (already set)\nQK_LLCK on NUM (G) and MOUSE (B)<\/pre><\/details><\/li><li><b>Remove Tap Dance<\/b>: ⌘1 and ⌘2 (and ⌘3 to ⌘9) are now ⌘ plus a digit on NUM. The double-tap timing delay goes away, along with about 60 lines of generated C.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>TAP_DANCE_ENABLE = no         # rules.mk; delete DANCE_0 and its handlers<\/pre><\/details><\/li><\/ul><h3>Combos and macros<\/h3><ul><li><b class='mono'>J+K (tap only)<\/b> → Esc: Vim needs Esc constantly, and this keeps it on the home row with no thumb or corner reach. It is tap-only, so holding J+K still gives ⇧⌘ for shortcuts like ⌘⇧E. &#x27;jk&#x27; almost never appears in English or Rust, so it rarely fires by accident.<\/li><li><b class='mono'>F+J (tap only)<\/b> → Caps Word: Tap both Shift keys together to type SCREAMING_SNAKE_CASE Rust constants and chat acronyms (API, PR, LLM) without holding Shift. Caps Word turns itself off at the next space or punctuation.<\/li><\/ul><\/div>\n    <div class=\"op B\"><h3>Expert B: features<\/h3><ul><li><b>Tap-hold baseline (config.h)<\/b>: This keeps today&#x27;s 200 ms feel and switches on the per-key callbacks below. Leave RETRO_TAPPING and HOLD_ON_OTHER_KEY_PRESS off: either one would make the Enter thumb fire (or turn into NAV) in situations where it doesn&#x27;t today. Don&#x27;t also set per-key tapping terms in Oryx, or the callbacks will be defined twice.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>#define TAPPING_TERM 200\n#define TAPPING_TERM_PER_KEY\n#define PERMISSIVE_HOLD_PER_KEY\n#define QUICK_TAP_TERM 120\n#define QUICK_TAP_TERM_PER_KEY<\/pre><\/details><\/li><li><b>Per-key tap-hold callbacks (C)<\/b>: Each line removes one misfire this user hits daily. &#x27; {&#x27; and &#x27; &amp;&#x27; after a space; Esc→⇧ in Vim; &#x27;Enter j&#x27; from a quick NAV chord. It also makes opposite-hand ⌘/⌃ shortcuts fire without waiting out the 200 ms.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>uint16_t get_tapping_term(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(3, KC_ENTER) ? 175 : TAPPING_TERM; // Enter must be a crisp tap\n}\nbool get_permissive_hold(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE):          // prose safety: a lingering Space thumb must stay a space\n    case MT(MOD_RSFT, KC_ESCAPE):  // Vim safety: Esc rolled into j must not become ⇧J\n      return false;\n    default:\n      return true;                 // home-row mods (guarded by Chordal Hold + Flow Tap), Enter/NAV, Tab/NUM\n  }\n}\nuint16_t get_quick_tap_term(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE): case LT(3, KC_ENTER): case LT(1, KC_TAB): case MT(MOD_RSFT, KC_ESCAPE):\n      return 0;                    // tap-then-hold on a thumb always means the layer or mod, never auto-repeat\n    default:\n      return QUICK_TAP_TERM;       // keeps tap-then-hold repeat on the
