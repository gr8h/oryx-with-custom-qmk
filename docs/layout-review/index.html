<title>Voyager Layout Review</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one layer per tab. Each version (Current, A, B) is a card: a large labelled keyboard plus a "what these keys do" list. A compare bar shows the clicked key across all three versions. */
:root{
  --bg:#eef0f4; --panel:#ffffff; --ink:#1b2130; --muted:#5d6577; --line:#d5d9e2; --case:#2a2f3b;
  --accent:#3559d6; --a:#0f8a6a; --b:#b4531a; --sel:#3559d6;
  --k-alpha:#dfe8fb; --k-mod:#d6f0dc; --k-num:#fbdde8; --k-sym:#fbf0c9; --k-edit:#e4e7ee; --k-nav:#fbd9d4;
  --k-ide:#d3eeee; --k-media:#fde3c8; --k-mouse:#e8dcfa; --k-sys:#e7e2d6; --k-fn:#dcdcf7; --k-macro:#f6dcf2;
  --k-none:#3a404d; --k-ink:#1b2130; --chg:#e0336b; --chip:#eef1f6;
  --f-display:"Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
  --f-body:"Atkinson Hyperlegible Next", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --key:56px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#141821; --panel:#1c212c; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2f3646; --case:#0c0f15;
  --accent:#8aa4ff; --a:#4fd1a8; --b:#f0975c; --sel:#8aa4ff;
  --k-alpha:#2a3956; --k-mod:#24452f; --k-num:#4d2737; --k-sym:#4a4120; --k-edit:#323846; --k-nav:#52302b;
  --k-ide:#1f4545; --k-media:#4f3820; --k-mouse:#3b2d55; --k-sys:#3e3a30; --k-fn:#30305a; --k-macro:#4a2a47;
  --k-none:#1c2029; --k-ink:#eef1f7; --chg:#ff6b9a; --chip:#262c39; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#141821; --panel:#1c212c; --ink:#e6e9f0; --muted:#9aa3b5; --line:#2f3646; --case:#0c0f15;
  --accent:#8aa4ff; --a:#4fd1a8; --b:#f0975c; --sel:#8aa4ff;
  --k-alpha:#2a3956; --k-mod:#24452f; --k-num:#4d2737; --k-sym:#4a4120; --k-edit:#323846; --k-nav:#52302b;
  --k-ide:#1f4545; --k-media:#4f3820; --k-mouse:#3b2d55; --k-sys:#3e3a30; --k-fn:#30305a; --k-macro:#4a2a47;
  --k-none:#1c2029; --k-ink:#eef1f7; --chg:#ff6b9a; --chip:#262c39; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1440px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));display:flex;flex-direction:column;gap:28px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:clamp(28px,4vw,40px);font-weight:700;letter-spacing:-.01em}
h2{font-size:24px} h3{font-size:17px}
p{margin:0;max-width:78ch}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.lede{color:var(--muted);font-size:16.5px}
header{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid2>*{min-width:0}
ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
li{max-width:85ch}
code,.mono{font-family:var(--f-mono);font-size:.88em}
.tag{display:inline-flex;align-items:center;font-family:var(--f-mono);font-size:11px;padding:1px 8px;border-radius:99px;border:1px solid currentColor;letter-spacing:.04em;font-weight:700}
.tA{color:var(--a)} .tB{color:var(--b)} .tC{color:var(--muted)}

/* toolbar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs a{font-family:var(--f-display);font-weight:700;font-size:14.5px;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:6px 14px;border-radius:8px}
.tabs a[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.opts{display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13.5px;color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{font:inherit;font-size:13px;color:var(--ink);background:transparent;border:0;padding:5px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.opts label{display:flex;gap:6px;align-items:center;cursor:pointer;color:var(--ink)}

/* layer view */
.view{display:flex;flex-direction:column;gap:20px}
.cmp{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.cmp-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
@media (max-width:760px){.cmp-grid{grid-template-columns:1fr}}
.cmp-cell{display:flex;flex-direction:column;gap:3px;min-width:0}
.cmp-cell .big{font-family:var(--f-display);font-weight:700;font-size:18px}
.cmp-cell .desc{font-size:13.5px;color:var(--muted)}
.versions{display:flex;flex-direction:column;gap:16px}
.vcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.vcard.A{border-left:4px solid var(--a)} .vcard.B{border-left:4px solid var(--b)} .vcard.C{border-left:4px solid var(--muted)}
.vhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.vhead h3{font-size:18px}
.vhead span.act{font-size:13px;color:var(--muted)}
.vbody{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:1200px){.vbody{grid-template-columns:minmax(0,1fr)}}
.kbwrap{overflow-x:auto;padding-bottom:4px;max-width:100%}
.gl{display:flex;flex-direction:column;gap:5px;font-size:13.5px;max-height:440px;overflow:auto;padding-right:4px}
.gl h4{margin:0 0 2px;font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:500}
.gl button{all:unset;cursor:pointer;display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline;padding:3px 6px;border-radius:6px}
.gl button:hover,.gl button:focus-visible{background:var(--chip)}
.gl button.on{background:color-mix(in srgb, var(--sel) 16%, transparent)}
.chip{font-family:var(--f-mono);font-size:12px;font-weight:700;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:1px 6px;justify-self:start;white-space:nowrap}
.gl b{font-weight:700}
.none-msg{color:var(--muted);font-size:14px}

/* keyboard */
.kb{background:var(--case);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;width:max-content}
.halves{display:flex;gap:calc(var(--key)*.55)}
.half{display:grid;grid-template-columns:repeat(6,var(--key));gap:4px}
.thumbs{display:flex;gap:calc(var(--key)*.55);margin-top:4px}
.tside{width:calc(var(--key)*6 + 20px);display:flex}
.tside.l{justify-content:flex-end} .tside.r{justify-content:flex-start}
.tpair{display:flex;gap:4px}
.tpair .k{width:calc(var(--key)*1.2)}
.tpair.l{transform:translateX(calc(var(--key)*.12)) rotate(7deg);transform-origin:right top}
.tpair.r{transform:translateX(calc(var(--key)*-.12)) rotate(-7deg);transform-origin:left top}
.k{all:unset;box-sizing:border-box;width:var(--key);height:var(--key);border-radius:7px;background:var(--k-none);color:var(--k-ink);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:2px}
.k .top{font-family:var(--f-mono);font-size:9.5px;font-weight:500;opacity:.72;line-height:1.1;white-space:nowrap;max-width:100%;overflow:hidden}
.k .main{font-family:var(--f-mono);font-weight:700;font-size:15px;line-height:1.05;max-width:100%;overflow:hidden}
.k .main.word{font-family:var(--f-body);font-size:11.5px;font-weight:700;white-space:normal;overflow-wrap:normal;hyphens:none}
.k .main.word.short{font-size:13.5px}
.k .glyph{display:none}
.k .h{font-family:var(--f-mono);font-size:9.5px;font-weight:500;opacity:.8;line-height:1.1;margin-top:2px;white-space:nowrap}
.k.trns{background:transparent;border:1px dashed color-mix(in srgb, var(--muted) 45%, transparent)}
.k.trns .main{opacity:.35;font-weight:500;font-size:12px}
.k.trns .h{color:var(--muted);opacity:1}
.k.none{opacity:.55}
.k:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.c-alpha{background:var(--k-alpha)} .c-mod{background:var(--k-mod)} .c-num{background:var(--k-num)} .c-sym{background:var(--k-sym)}
.c-edit{background:var(--k-edit)} .c-nav{background:var(--k-nav)} .c-ide{background:var(--k-ide)} .c-media{background:var(--k-media)}
.c-mouse{background:var(--k-mouse)} .c-sys{background:var(--k-sys)} .c-fn{background:var(--k-fn)} .c-macro{background:var(--k-macro)}
.showchg .k.chg{box-shadow:inset 0 0 0 2px var(--chg)}
.k.sel{outline:3px solid var(--sel);outline-offset:1px;z-index:1}
/* compact side-by-side view */
.compact{--key:27px}
.compact .versions{display:grid;grid-template-columns:repeat(3,max-content);gap:14px;overflow-x:auto}
@media (max-width:1300px){.compact .versions{grid-template-columns:repeat(2,max-content)}}
@media (max-width:880px){.compact .versions{grid-template-columns:max-content}}
.compact .vbody{grid-template-columns:max-content}
.compact .gl{display:none}
.compact .k .top{display:none}
.compact .k .main{display:none}
.compact .k .glyph{display:block;font-family:var(--f-mono);font-weight:700;font-size:10.5px;line-height:1;white-space:nowrap;max-width:100%;overflow:hidden}
.compact .k .h{font-size:7.5px;margin-top:1px}
.compact .k{border-radius:5px}
@media (max-width:700px){ :root{--key:48px} .k .main{font-size:13px} .k .main.word{font-size:10px} .k .top,.k .h{font-size:8.5px} }

.legend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:12.5px;color:var(--muted);align-items:center}
.legend i{display:inline-block;width:13px;height:13px;border-radius:3px;vertical-align:-2px;margin-right:5px}
.opinions{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.opinions>*{min-width:0}
.op{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.op.A{border-top:3px solid var(--a)} .op.B{border-top:3px solid var(--b)}
.op li{font-size:14px}
.why{font-size:14.5px}
.note{font-size:14.5px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;vertical-align:top;padding:8px 10px;border-bottom:1px solid var(--line)}
th{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto}
pre{font-family:var(--f-mono);font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:4px 0 0;white-space:pre-wrap;overflow-x:auto}
details summary{cursor:pointer}
.verdict{border-left:4px solid var(--accent)}
@media (prefers-reduced-motion:no-preference){ .k{transition:box-shadow .15s, outline-color .15s} }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">ZSA Voyager · layout nd96R · macOS</div>
    <h1>Voyager layout review</h1>
    <p class="lede" id="lede"></p>
  </header>
  <div id="intro"></div>
  <div class="bar">

      <span>Click any key to compare it across versions.</span>

  </div>
  <main id="main"></main>
  <div class="legend" id="legend"></div>
</div>

nav", "nav", "nav", "nav", "media", "media"], ["sys", "ide", "ide", "ide", "ide", "none", "nav", "nav", "nav", "nav", "media", "sys"], ["trns", "trns", "trns", "trns"]], "replaces": 3}]}, "A": {"expert": "Expert A — ergonomic minimalist", "school": "Miryoku-style 3x5 + thumbs (Manna Harbour), Callum's modifiers on every layer, Pascal Getreuer's tap-hold tuning (Chordal Hold, Flow Tap), Seniply's Extend-layer conventions, Ben Vallack's small-footprint discipline", "summary": "Your layout gets several things right already: home-row mods, Vim arrows on HJKL, an unshifted :, and an empty number row. The problem is where the busiest keys live. Backspace sits on two outer pinky keys, and Shift is either an outer pinky key or a thumb hold shared with Esc. SYM is held by the same hand that types half its symbols, and NAV, NUM and MOUSE have no modifiers, so selecting text, ⌘+digit and ⌘-click all mean holding a modifier first. I rebuild it as a Miryoku-style 3x5 core plus four thumbs: Space/NAV and Tab/NUM on the left, Enter/FUN and Backspace/SYM on the right. Each layer's keys sit under the opposite hand, the same ⌃⌥⌘⇧ home row repeats on every layer, and the outer columns go dark apart from '. Chordal Hold, Flow Tap and Permissive Hold make the home-row mods (now with Shift) safe at speed, and F-keys, Caps Word, Del and clipboard keys fill the gaps. No typed-text macros are needed, because -> and => are already two-tap rolls.", "layers": [{"id": 0, "replaces": 0, "name": "Base", "activation": "default", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "--"], ["--", "A", "S", "D", "F", "G", "H", "J", "K", "L", ":", "'"], ["--", "Z", "X", "C", "V", "B", "N", "M", ",", ".", ";", "--"], ["Space", "Tab", "Enter", "Bspc"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "⌃", "⌥", "⌘", "⇧", "", "", "⇧", "⌘", "⌥", "⌃", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["NAV", "NUM", "FUN", "SYM"]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "none"], ["none", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym"], ["none", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym", "sym", "none"], ["edit", "edit", "edit", "edit"]], "changes": ["Backspace moves from two outer-column keys (top right and bottom left) to the tap of the R-outer thumb, the primary right thumb. It is one of your most-pressed keys and no longer needs a pinky stretch.", "Shift goes on the home row at F and J, which had no modifier before. Your ⌃ ⌥ ⌘ order on A S D and ; L K stays the same, so nothing you already know moves. The OS⇧ key on the outer pinky column and the Esc/⇧ thumb go away, and Shift is now on the strongest finger of each hand, the same on every layer.", "The thumbs get new jobs so that each layer key sits on the opposite hand from what it holds: Space/NAV on L-outer (Space stays, NAV moves here from L-inner), Tab/NUM on L-inner, Enter/FUN on R-inner, and Bspc/SYM on R-outer. Space and Backspace are the taps on the two primary thumbs.", "Esc leaves the corner key and the right thumb and becomes a J+K tap combo. It sends a real Esc, so it works in insert mode, the terminal and chat. Holding J+K still gives ⇧⌘ for shortcuts.", "= leaves the bottom-right outer key, a diagonal pinky stretch, and goes to the SYM home row. The second Tab and the second Bspc are removed. The other outer keys and the whole number row are empty on purpose.", "' stays on the right outer home key. It is the only outer-column key I kept: you type apostrophes in chat all day, it would be worse behind a layer, and this is the ANSI spot your finger already knows.", "Kept as they are: the QWERTY letters (so HJKL and your typing speed survive), : on the right pinky home key (tap :, hold ⌃) and ; at bottom right. Both are good choices for Vim and Rust.", "New (C): a key override makes Shift+; send ?. That puts ? back where QWERTY fingers expect it, Shift plus the bottom-right pinky key, and the combination is otherwise wasted because today it only repeats the : you already have."], "why": "Every key you press thousands of times a day is now under a thumb, on the home row, or a home-row combo. That covers Space, Backspace, Enter, Tab, Shift and Esc. The pinkies only type letters and : ; '. All four modifiers repeat on both home rows in the same order, so any shortcut can be an easy chord across both hands. Chordal Hold and Flow Tap keep fast typing free of accidental modifiers."}, {"id": 1, "replaces": 1, "name": "Numbers", "activation": "hold L-inner thumb (tap = Tab)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "--", "--", "--", "--", "--", "+", "7", "8", "9", "*", "--"], ["--", "⌃", "⌥", "⌘", "⇧", "LLock", "-", "4", "5", "6", ":", "--"], ["--", "--", "--", "--", "--", "--", "#", "1", "2", "3", "\\", "--"], ["", "", ".", "0"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "none", "none", "none", "none", "none", "sym", "num", "num", "num", "sym", "none"], ["none", "mod", "mod", "mod", "mod", "sys", "sym", "num", "num", "num", "sym", "none"], ["none", "none", "none", "none", "none", "none", "sym", "num", "num", "num", "sym", "none"], ["trns", "trns", "num", "num"]], "changes": ["The layer is now held with the L-inner thumb instead of R-inner, so the digits sit on the opposite hand as a built-in numpad: 789 / 456 / 123 on U I O / J K L / M , . with 0 under the right primary thumb and . on R-inner. Today 6 to 0 sit under the same hand that is holding the layer.", "The keypad operator keys (KP-, KP+, KP*, KP/) become plain + - * keys. Terminals and Vim can turn keypad codes into something else when application-keypad mode is on.", "The left home row gets plain ⌃ ⌥ ⌘ ⇧. ⌘1 to ⌘9 (VS Code editor groups, Slack and browser tabs) is now hold-and-tap with any digit, which replaces the ⌘1/⌘2 tap dance. ⇧ plus a digit gives the same symbols as on a normal number row: ! @ # $ % ^ & * ( ).", "The spare slots hold : (times, and ports such as localhost:8080), # (issue numbers) and \\. % and ^ lose their own keys because ⇧5 and ⇧6 already make them.", "Layer Lock goes on G, so long runs of numbers such as tables, IP addresses or test data don't need a held thumb.", "MyComputer (top right) is removed because it does nothing useful on macOS."], "why": "Holding with one hand and typing with the other leaves the right hand free to type numbers in the familiar numpad shape. The left thumb holds the layer and the left fingers add modifiers. That gives you ⌘+digit, ⇧+digit and ⌃+digit (tmux windows) for free, so the tap dance and the keypad keycodes can go."}, {"id": 2, "replaces": 2, "name": "Symbols", "activation": "hold R-outer thumb (tap = Backspace)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "`", "<", "{", "}", "@", "--", "--", "--", "--", "--", "--"], ["--", "=", "!", "(", ")", "&", "--", "⇧", "⌘", "⌥", "⌃", "--"], ["--", "/", ">", "[", "]", "|", "--", "--", "--", "--", "--", "--"], ["_", "-", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "none", "none", "none", "none", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "mod", "mod", "mod", "mod", "none"], ["none", "sym", "sym", "sym", "sym", "sym", "none", "none", "none", "none", "none", "none"], ["sym", "sym", "trns", "trns"]], "changes": ["The layer is now held with the R-outer thumb (Bspc) instead of L-outer (Space), and every symbol is on the left hand. Today half the symbols sit under the same hand that is holding the layer.", "The three bracket pairs stack on the middle and index fingers: { } on top, ( ) on the home row, [ ] below. Each pair is an inward roll, so println!( and vec![ type without changing rows.", "= (pinky) and ! (ring) go on the home row, with < above and > below them, so == != => <= >= are rolls between neighbouring fingers. _ and - move to the two left thumbs, so snake_case, --release and -> need no finger movement.", "/ ` @ | & join the main 3x5 keys. ? moves to ⇧; on the base layer and \" to ⇧'. < and > still also work as ⇧, and ⇧. as usual, and ~ is ⇧`. $ % ^ # * live on NUM, as their own keys or as ⇧ plus a digit. The extra copies of 0 and . are removed.", "The right home row gets plain ⇧ ⌘ ⌥ ⌃ for shortcuts that use a symbol: ⌘/ (toggle comment), ⌘[ and ⌘] (outdent and indent), ⌃` (terminal), ⌘= and ⌘- (zoom)."], "why": "Rust uses a lot of symbols. With the right thumb holding and the right fingers on modifiers, every symbol is under the left hand, so you never have to press a thumb and a finger of the same hand together. The most common Rust pairs (-> => != && || () {} []) become two-tap rolls inside the layer, and :: stays on the base pinky."}, {"id": 3, "replaces": 3, "name": "Nav / IDE", "activation": "hold L-outer thumb (tap = Space)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "⌃`", "⌘\\", "⌘⇧[", "⌘⇧]", "⌘⇧F", "⌥P", "⌥H", "⌥L", "⌥N", "⌃⇧-", "--"], ["--", "⌃", "⌥", "⌘", "⇧", "⌃⇧G", "←", "↓", "↑", "→", "⌃-", "--"], ["--", "⌘Z", "⌘X", "⌘C", "⌘V", "⌘⇧Z", "Home", "PgDn", "PgUp", "End", "CapsW", "--"], ["", "", "Enter", "Del"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "nav", "none"], ["none", "mod", "mod", "mod", "mod", "ide", "nav", "nav", "nav", "nav", "nav", "none"], ["none", "edit", "edit", "edit", "edit", "edit", "nav", "nav", "nav", "nav", "edit", "none"], ["trns", "trns", "edit", "edit"]], "changes": ["The layer is now held with L-outer (Space) instead of L-inner (Enter). The layer you hold most goes on the primary thumb, and Enter no longer shares a key with a layer you hold all day.", "The left home row becomes plain ⌃ ⌥ ⌘ ⇧: ⇧+arrows selects, ⌥+arrows jumps by word, ⌘+arrows goes to line or file ends, ⌃+arrows switches macOS Spaces, and ⌥↑/↓ moves a line in VS Code. The current layer has no modifiers at all.", "Kept exactly as they are: arrows on HJKL, Home/PgDn/PgUp/End under them, and the tmux keys ⌥P ⌥H ⌥L ⌥N above them. They still send Right Option; switch them to Left Option only if a terminal types special characters instead of running the binding.", "Shortcuts built on a symbol or a hard-to-chord key keep their own key: ⌘\\ ⌘⇧[ ⌘⇧] stay on W E R, ⌃` moves from V to Q, ⌘⇧F from D to T and ⌃⇧G from S to G. Shortcuts built on a letter (⌘⇧E, ⌘⇧H, ⌥⌘C, ⌥⌘⇧C, ⌘↓, ⌥Space) lose their key, because with home-row mods on both hands they are now easy chords: hold J+K and tap E, or hold L and tap Space.", "The bottom-left keys become ⌘Z ⌘X ⌘C ⌘V ⌘⇧Z on Z X C V B, so you can select with ⇧+arrows and copy or paste without leaving the layer. This is Seniply's Extend-layer convention.", "New: VS Code Back (⌃-) and Forward (⌃⇧-) on the right pinky column, for the jumps back and forth around go-to-definition that Rust navigation is full of. Caps Word goes under them.", "While you navigate, the right thumbs are Enter and Del. Media, volume and the screenshot key move to the new FUN layer, and the outer columns are cleared."], "why": "Navigation is now held on the primary thumb with modifiers under the same hand, so editing with arrows can really replace the mouse: select a word, jump to the end of a line, or move a line. The Vim-style arrow block you built stays exactly as it is, and the VS Code shortcuts that really need their own key keep one."}, {"id": 5, "replaces": null, "name": "Fn / Media", "activation": "hold R-inner thumb (tap = Enter)", "tap": [["--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--"], ["--", "F12", "F7", "F8", "F9", "⌘⇧4", "--", "--", "--", "--", "--", "--"], ["--", "F11", "F4", "F5", "F6", "Vol+", "--", "⇧", "⌘", "⌥", "⌃", "--"], ["--", "F10", "F1", "F2", "F3", "Vol-", "--", "--", "--", "--", "--", "--"], ["Play", "⌃⌘⇧4", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none"], ["none", "fn", "fn", "fn", "fn", "sys", "none", "none", "none", "none", "none", "none"], ["none", "fn", "fn", "fn", "fn", "media", "none", "mod", "mod", "mod", "mod", "none"], ["none", "fn", "fn", "fn", "fn", "media", "none", "none", "none", "none", "none", "none"], ["media", "sys", "trns", "trns"]], "changes": ["New layer, held with R-inner (Enter). F1 to F12 sit on the left hand in the same 789 / 456 / 123 shape as the NUM digits, with F10 to F12 on the pinky column. The current layout has no F-keys at all, and VS Code wants F2 (rename symbol), F12 (go to definition), F8 (next problem) and F5/F9/F10/F11 (debugging).", "The right home row has ⇧ ⌘ ⌥ ⌃ for ⇧F12 (find references) and ⌥F12 (peek definition).", "Volume up and down and the ⌘⇧4 screenshot move here from NAV's outer columns, and Play/Pause goes on the left primary thumb.", "New: ⌃⌘⇧4 (screenshot an area to the clipboard) on L-inner, so you can paste straight into Slack or an LLM chat without a file landing on the desktop.", "Stop and Mute are dropped. Media Stop does nothing on macOS, and Mute is rarely needed next to Vol- and Play/Pause."], "why": "F-keys and media are rare enough to sit behind the least-used thumb hold. But a Rust workflow in VS Code really needs F2 and F12, and the current layout can't send them at all. Grouping them with the system keys also clears every outer-column key off NAV."}], "combos": [{"keys": "J+K (tap only)", "output": "Esc", "why": "Vim needs Esc constantly, and this keeps it on the home row with no thumb or corner reach. It is tap-only, so holding J+K still gives ⇧⌘ for shortcuts like ⌘⇧E. 'jk' almost never appears in English or Rust, so it rarely fires by accident."}, {"keys": "F+J (tap only)", "output": "Caps Word", "why": "Tap both Shift keys together to type SCREAMING_SNAKE_CASE Rust constants and chat acronyms (API, PR, LLM) without holding Shift. Caps Word turns itself off at the next space or punctuation."}], "macros": [], "features": [{"name": "Chordal Hold, with thumbs exempt (the exemption is C)", "config": "#define CHORDAL_HOLD\n// keymap.c (C): mark the thumbs '*' so the layer thumbs can chord with either hand\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n                 '*','*',  '*','*');", "why": "A home-row mod pressed with another key on the same hand types as a letter, which removes most rolling misfires such as 'as' turning into ⌃s. Several mods on the same hand can still be held together, for example J+K for ⇧⌘. Without the '*' exemption, holding Space for NAV and then pressing ⇧ on F, or Shift on F plus Tab, would count as a same-hand roll."}, {"name": "Flow Tap, with Shift exempt (the per-key rule is C)", "config": "#define FLOW_TAP_TERM 150\n// keymap.c (C)\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case LSFT_T(KC_F):\n    case RSFT_T(KC_J):\n      return 0;  // Shift: never force a tap\n  }\n  return (is_flow_tap_key(keycode) && is_flow_tap_key(prev_keycode)) ? FLOW_TAP_TERM : 0;\n}", "why": "If a home-row mod (or Space/NAV) is pressed within 150 ms of the previous letter, it is always a tap, so fast typing never fires a modifier and letters arrive without delay. Shift is exempt so capitals right after a space, and PascalCase such as HashMap, still work at full speed. Bspc/SYM, Tab/NUM and Enter/FUN aren't covered by Flow Tap by default, so a symbol right after a letter, as in foo(, is still instant."}, {"name": "Permissive Hold, plus Hold On Other Key Press for NUM (C)", "config": "#define TAPPING_TERM 200\n#define PERMISSIVE_HOLD\n#define HOLD_ON_OTHER_KEY_PRESS_PER_KEY\n// keymap.c (C)\nbool get_hold_on_other_key_press(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(1, KC_TAB);  // NUM thumb\n}", "why": "Permissive Hold lets a held layer or mod work as soon as you press and release another key inside it, so you don't have to wait 200 ms for each symbol. NUM also uses Hold On Other Key Press: if you let go of the thumb before the digit, you still get the digit and not Tab+letter, which in Slack would move focus. Space keeps plain Permissive Hold because you roll from Space into letters all the time."}, {"name": "Quick Tap Term", "config": "#define QUICK_TAP_TERM 120", "why": "Tap and then quickly hold a key to auto-repeat it: Bspc on the SYM thumb, or j in Vim, now that J is also Shift. A slower tap-then-hold still gives the modifier."}, {"name": "Tap-only combos (C)", "config": "COMBO_ENABLE = yes            # rules.mk\n#define COMBO_TERM 40\n#define COMBO_MUST_TAP_PER_COMBO\n// keymap.c (C)\nbool get_combo_must_tap(uint16_t index, combo_t *combo) { return true; }", "why": "Both combos use home-row mod keys. Tap-only means a held J+K or F+J falls through to the modifiers, so the combos never block ⇧⌘ or ⇧⇧ chords."}, {"name": "Caps Word", "config": "CAPS_WORD_ENABLE = yes        # rules.mk\n#define CAPS_WORD_IDLE_TIMEOUT 3000", "why": "Rust constants and enum-style identifiers are SCREAMING_SNAKE_CASE. Caps Word keeps going through _ (the SYM thumb) and digits, and stops by itself. You can turn it on from the F+J combo or the CapsW key on NAV."}, {"name": "Key override: Shift+; sends ? (C)", "config": "KEY_OVERRIDE_ENABLE = yes     # rules.mk\n// keymap.c (C)\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &shift_scln_ques };", "why": "Puts ? back on its QWERTY spot (Shift plus the bottom-right pinky key) for chat questions and Rust's ? operator, without using up a SYM slot. Shift+; was only a second copy of the : on the home row."}, {"name": "Layer Lock (already enabled)", "config": "LAYER_LOCK_ENABLE = yes       # rules.mk (already set)\nQK_LLCK on NUM (G) and MOUSE (B)", "why": "Lock NUM for long runs of numbers and MOUSE for long pointer sessions, without holding a thumb."}, {"name": "Remove Tap Dance", "config": "TAP_DANCE_ENABLE = no         # rules.mk; delete DANCE_0 and its handlers", "why": "⌘1 and ⌘2 (and ⌘3 to ⌘9) are now ⌘ plus a digit on NUM. The double-tap timing delay goes away, along with about 60 lines of generated C."}], "missing": ["F1-F12. There are none today, and VS Code needs F2 (rename), F12 (go to definition), F8 (next problem) and the debugger keys.", "Backspace on a thumb", "Shift on the home row (F and J)", "Caps Word for SCREAMING_SNAKE_CASE constants and acronyms", "Forward Delete", "VS Code Back and Forward (⌃- and ⌃⇧-)", "Esc without leaving the home row (J+K)", "Tap-hold tuning (Chordal Hold, Flow Tap, Permissive Hold). Today everything runs on QMK defaults.", "Layer Lock for NUM", "Screenshot to the clipboard (⌃⌘⇧4), for pasting into chat"], "risks": ["This is a big relearn. Every thumb except Space changes its job, digits become a numpad, and SYM is new. Expect two to four weeks of slower typing, and longer before your symbol speed in Rust catches up.", "Esc is a combo now. It fires when you release J+K, and you have to press both within 40 ms. Years of reaching for a corner or thumb Esc will pull at you at first.", "Shift on the home row is new for you. Flow Tap is off for F and J on purpose, so that capitals work, which leaves those two protected only by Chordal Hold and Permissive Hold. A lingering index finger can produce a stray capital (in Vim normal mode, a stray O or J).", "Flow Tap on Space/NAV means you have to pause about 150 ms after a letter before holding Space for arrows. If you don't, you get a space.", "Enter shares its key with the FUN hold. If you let go of the thumb before the F-key during a quick FUN press, you get Enter plus a letter, which sends a chat message. Hold FUN deliberately, or move FUN somewhere else if it bites.", "Bspc shares its key with the SYM hold. If you let go of the thumb before the symbol key, you get Backspace plus a letter. It's harmless and easy to see, but it will happen while you learn.", "$ % ^ ~ now take three keys (⇧ plus a digit on NUM, or ⇧ plus ` on SYM).", "⌘⇧E, ⌘⇧H, the copy-path keys, ⌘1/⌘2 and ⌥Space lose their own keys and become home-row chords, so each takes one key more than today.", "In Vim, holding j to repeat now needs a tap first and then a hold, because J is Shift. Holding Space+J for repeated ↓ works too.", "Chordal Hold for the thumbs, per-key Flow Tap, tap-only combos and the key override all need custom C, which Oryx can't express. They live in this repo's custom QMK merge, and you need to check they survive each Oryx re-export.", "The outer columns go dark. If that's too abrupt, put Esc, Bspc and Tab back in their old spots for two weeks as training wheels, then remove them.", "' is still on an outer column (one sideways pinky reach), on purpose."]}, "B": {"expert": "Expert B: pragmatic power user", "school": "Pragmatic 'keep what works' tuning: Getreuer's QMK tap-hold practice (Chordal Hold, scoped Flow Tap), Precondition's home-row-mods guide, r/ErgoMechKeyboards incrementalism, symbol placement from Rust frequency.", "summary": "This is a sound layout. It is QWERTY with a light set of home-row mods (no Shift on the index fingers), ':' unshifted on the home row (right for both Vim and Rust paths), and Space/Enter/Tab/Esc on the thumbs. So I keep every letter and thumb where it is and put the effort into firmware behaviour and the gaps. The worst problems are timing, not placement. The default quick-tap term turns ' {', ' &' and ' ->' (a space, then holding Space for a symbol) into a repeated space plus a letter, and does the same to Esc-then-Shift in Vim. With no permissive hold, a quick NAV chord can leak an Enter that sends a chat message. And switching on Flow Tap with its defaults would break snake_case, because it treats the Space thumb as a typing key. The functional gaps are no modifiers on NAV (so ⌥←, ⌘← and ⇧-selection are impossible), no F-keys anywhere, no ⌘-click on the mouse layer, mouse-layer KC_NO keys that silently eat the first letters typed after a click, and no reliable Shift+Enter. I fix these with mods on NAV in the same order as the base home-row mods, an FN tri-layer that mirrors the digits, a dedicated ⇧⏎, two Rust arrow macros and a Leader for the long tokens. Only eight existing keys change position.", "layers": [{"id": 0, "replaces": 0, "name": "Base", "activation": "default layer", "tap": [["Esc", "--", "--", "--", "--", "Lead", "CW", "--", "--", "--", "--", "⌃⌘⇧4"], ["Tab", "Q", "W", "E", "R", "T", "Y", "U", "I", "O", "P", "Bspc"], ["OS⇧", "A", "S", "D", "F", "G", "H", "J", "K", "L", ":", "'"], ["Bspc", "Z", "X", "C", "V", "B", "N", "M", ",", ".", ";", "="], ["Space", "Enter", "Tab", "Esc"]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "⌃", "⌥", "⌘", "", "", "", "", "⌘", "⌥", "⌃", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["SYM", "NAV", "NUM", "⇧"]], "cat": [["edit", "none", "none", "none", "none", "macro", "mod", "none", "none", "none", "none", "sys"], ["edit", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "edit"], ["mod", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym"], ["edit", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "alpha", "sym", "sym", "sym", "sym"], ["edit", "edit", "edit", "edit"]], "changes": ["KEPT: every alpha, the ⌃⌥⌘ / ⌘⌥⌃ home-row mods with no Shift on F/J, ':' unshifted on the home-row pinky (right for Vim and for Rust '::' paths), ';' bottom-right, both Backspaces (the left one matters while your right hand is on the Navigator), both Tabs, and all four thumbs. This is muscle memory worth keeping.", "Top row (was all KC_NO apart from Esc): Leader above T, Caps Word above Y, and ⌃⌘⇧4 (screenshot to the clipboard, for pasting into Slack or an LLM chat) top-right. These are rare, harmless keys, so an overshoot from Esc or Bspc costs nothing. In Oryx put a placeholder such as F24 on the Leader key and map it to leader_start() in process_record_user (C), so an Oryx re-export can't overwrite it.", "Space/SYM thumb: quick-tap term set to 0 (C). With the default (200 ms), tapping Space and then holding it for a symbol repeats the space and types the base letter. That breaks ' {', ' &', ' ->', ' |x|', all very common in Rust (e.g. 'fn main() {' gives 'fn main()  j').", "Esc/⇧ thumb: quick-tap term 0 (C). Today, Esc followed by holding the same thumb for Shift (Vim '<Esc>A', '<Esc>O') repeats Esc and types a lowercase a/o.", "Enter/NAV and Tab/NUM thumbs: permissive hold on (C), so 'thumb down, tap J, thumb up' is ↓ and not 'Enter j'. That stray Enter is how a NAV chord sends a chat message today. The Enter thumb also gets a 175 ms tapping term: a hesitant press now sends nothing rather than Enter. Quick-tap is 0 on both.", "Home-row mods: Chordal Hold (thumbs exempt), Flow Tap 150 ms and permissive hold (C). Opposite-hand shortcuts such as K+C → ⌘C fire on the nested release with no 200 ms wait. Mid-word rolls can no longer turn into mods. Same-hand chords still need the hold you use today.", "Flow Tap is scoped to the home-row mods only (C). Its default treats the Space thumb as a typing key, which would force a space whenever you hold Space within 150 ms of a letter, so 'user_name' would come out as 'user hname'.", "Key override: ⇧ + ';' sends '?' (C). ';' sits where '/' was on ANSI, so Shift+that key gives '?' exactly where your fingers expect it, which helps in chat. Nothing is lost, because ':' already has its own key.", "Double-tap OSM⇧ turns on Caps Word (config.h), for SCREAMING_SNAKE consts and env vars. The top-row CW key is the visible fallback.", "Shift+Enter: OSM⇧ then Enter already works and stays. Holding ⇧ on R-outer while tapping Enter becomes reliable once permissive hold is on. There is a new dedicated ⇧⏎ on SYM + R-inner thumb (see SYM)."], "why": "The base already does the hard things right, so moving letters or thumbs would buy you weeks of relearning for little gain. The real damage comes from the default tap-hold timing on the thumbs: it eats ' {' after a space, Esc-then-Shift in Vim, and lets a quick NAV chord turn into a sent message. The changes are almost all firmware behaviour, plus three rare keys on the empty top row."}, {"id": 1, "replaces": 1, "name": "Numbers", "activation": "hold R-inner thumb (Tab)", "tap": [["", "", "", "", "", "", "", "", "", "", "", "--"], ["", "--", "--", "--", "--", "%", "^", "-", "+", "*", "/", ""], ["", "1", "2", "3", "4", "5", "6", "7", "8", "9", "0", ""], ["", "--", "--", "--", "--", "--", "0", "--", "", "", "", ""], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "FN", "", ""]], "cat": [["trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "none"], ["trns", "none", "none", "none", "none", "sym", "sym", "sym", "sym", "sym", "sym", "trns"], ["trns", "num", "num", "num", "num", "num", "num", "num", "num", "num", "num", "trns"], ["trns", "none", "none", "none", "none", "none", "num", "none", "trns", "trns", "trns", "trns"], ["trns", "trns", "trns", "trns"]], "changes": ["KP-, KP+, KP*, KP/ → plain -, +, *, / in the same positions. Keypad keycodes send different escape sequences when a terminal or Vim switches to application-keypad mode (you get stray 'Om'/'Ok' text or no-ops). The position is unchanged, only the keycode.", "MyComputer (top-right) → no key. That consumer code does nothing on macOS.", "KEPT: digits 1-0 along the home row, '%' '^' above 5/6, the extra '0' under N, and transparent ',' '.' '=' Bspc for decimals, ranges ('0..10') and arithmetic. All of this is good: Vim counts ('5j', ':42⏎') are thumb + home row.", "While NUM is held, also holding the L-inner thumb (NAV) opens the new FN layer (tri-layer, C). Tapping L-inner still gives Enter, so ':42⏎' works without letting go of NUM.", "F-keys deliberately not here: they live on FN in the same positions as the digits, so 'F2 is where 2 is'."], "why": "This layer was already right ergonomically, with digits on the home row under a held thumb. The fix is the keypad keycodes, which misbehave in exactly the tools you use (terminal Vim, tmux). Nothing moves, so there is no relearning."}, {"id": 2, "replaces": 2, "name": "Symbols", "activation": "hold L-outer thumb (Space)", "tap": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "!", "@", "[", "]", "%", "^", "-", "+", "*", "\\", ""], ["", "?", "&", "<", ">", "#", "_", "{", "}", "|", "/", "\""], ["", "~", "`", "(", ")", "$", "->", "=>", "", "", "", ""], ["", "", "⇧⏎", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", ""]], "cat": [["trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "trns"], ["trns", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym", "sym"], ["trns", "sym", "sym", "sym", "sym", "sym", "macro", "macro", "trns", "trns", "trns", "trns"], ["trns", "trns", "edit", "trns"]], "changes": ["'/' ↔ '\\' swapped: '/' moves from the right-pinky top row to the right-pinky home row (the old '\\' slot), and '\\' goes up to P. '/' is the busiest symbol here for you: '//' and '///' doc comments in Rust, '/' search in Vim, paths and URLs in chat. '\\' is close to unused in Rust. Same finger, one row, so it's cheap to relearn. On NUM, '/' stays on P next to - + *.", "N: stray '0' (copied from NUM; nobody types 0 from the symbol layer) → '->' macro. M: empty → '=>' macro. Return types and match arms are on almost every screen of Rust. Both are now one key under the index finger, with no cross-hand '-' then '>' and no pinky trip to '='.", "R-inner thumb (was transparent Tab/NUM) → ⇧⏎. Hold Space and tap the right inner thumb for a newline in Slack or an LLM chat. It is a plain key, so it fires on press. If you roll it too fast the result is Space+Tab, never a sent message.", "KEPT: '_' on H (snake_case), '{' '}' on J K, '<' '>' on D F, '(' ')' on C V, '?' '&' '#' '|' '\"' '!' '@' '[' ']' '`' '~' '$' '%' '^' '-' '+' '*'. These are already in good frequency order for Rust. Same-hand thumb+finger symbols are fine because the thumb moves independently, so I don't mirror the layer the way a minimalist would.", "'::' deliberately not a macro: two taps on the home-row ':' are already as fast as one layer chord."], "why": "Your symbol layer already puts Rust's heavy hitters (_ {} <> () & ?) on or near the home row, so I only fix two clear misallocations: '/' on a weak key while '\\' wastes a home-row slot, and a stray '0'. I also add the two Rust tokens that really cost effort, plus a safe Shift+Enter. Nothing you type often moves except '/', and it moves one row on the same finger."}, {"id": 3, "replaces": 3, "name": "Nav / IDE / media", "activation": "hold L-inner thumb (Enter)", "tap": [["", "", "⌃⇧G", "⌘⇧F", "⌘⇧H", "", "", "", "", "", "", ""], ["", "⌘.", "⌘\\", "⌘⇧[", "⌘⇧]", "⌘↓", "⌥P", "⌥H", "⌥L", "⌥N", "Play", "Del"], ["", "⌃", "⌥", "⌘", "⇧", "⌘⇧E", "←", "↓", "↑", "→", "Vol-", "Vol+"], ["⌥Spc", "⌥⌘⇧C", "⌥⌘C", "⌘1/2", "⌃`", "⌘⇧P", "Home", "PgDn", "PgUp", "End", "Mute", "⌘⇧4"], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "FN", ""]], "cat": [["trns", "trns", "ide", "ide", "ide", "trns", "trns", "trns", "trns", "trns", "trns", "trns"], ["trns", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "media", "edit"], ["trns", "mod", "mod", "mod", "mod", "ide", "nav", "nav", "nav", "nav", "media", "media"], ["sys", "ide", "ide", "ide", "ide", "ide", "nav", "nav", "nav", "nav", "media", "sys"], ["trns", "trns", "trns", "trns"]], "changes": ["Left home row → plain ⌃ ⌥ ⌘ ⇧ on A S D F, the same order as the base home-row mods plus ⇧ on the index finger. Selection and jumps become one-handed chords: ⌥←/⌥→ by word, ⌘←/⌘→ to line start/end in Mac-native apps where Home/End only scroll, ⇧+arrows to select, ⌥⇧→ to select a word, ⌘⇧↑ to select to the top. Holding D and tapping the R-inner thumb gives ⌘Tab. Today none of this is possible, because ⌘/⌥ live under the arrows. Colour these four keys green like the base mods.", "The three VS Code search keys displaced from the home row keep their columns and move up two rows: ⌃⇧G (Source Control) above S, ⌘⇧F (search in files) above D, ⌘⇧H (replace in files) above F. ⌘⇧E (Explorer) stays on G. This is the main relearn in the whole proposal.", "Q (was empty) → ⌘. (Quick Fix: rust-analyzer imports, fill match arms). B (was empty) → ⌘⇧P (command palette).", "Media Stop (top-right) → Del (forward delete), on the Backspace position so it reads 'Backspace, but forward'. Most macOS players ignore Stop, and a Mac has no forward delete without fn. ⌥ on S + Del deletes a word forward.", "KEPT: vim arrows on HJKL with Home/PgDn/PgUp/End under them, ⌘\\ split, ⌘⇧[ ] tab switching, ⌘↓, copy-path keys, the ⌘1/⌘2 tap dance, ⌃` terminal, ⌥Space launcher, Play, volume, Mute, ⌘⇧4. Those are your choices and they're good.", "KEPT on Right Option: the tmux keys ⌥P/⌥H/⌥L/⌥N. If they work today, your terminal already treats Right Option as Meta. If you ever switch terminals and they print '˙' or 'π', change the four keycodes to LALT.", "R-inner thumb held while NAV is held → FN layer (tri-layer, C)."], "why": "The single biggest functional gap in the layout is that NAV has arrows but no modifiers, which is crippling for editing text in Slack or an LLM chat box. Putting the mods where your fingers already expect ⌃⌥⌘ fixes it with almost no learning. Every existing VS Code and tmux shortcut survives, and three of them shift up in their own columns."}, {"id": 5, "replaces": null, "name": "FN / system", "activation": "hold both inner thumbs (Enter/NAV + Tab/NUM): tri-layer (C)", "tap": [["Boot", "--", "--", "--", "--", "--", "--", "--", "--", "--", "--", "Lock"], ["--", "RGB", "Bri-", "Bri+", "--", "--", "--", "--", "--", "--", "--", "--"], ["F11", "F1", "F2", "F3", "F4", "F5", "F6", "F7", "F8", "F9", "F10", "F12"], ["⇧F11", "--", "--", "--", "--", "⇧F5", "--", "--", "⇧F8", "--", "--", "⇧F12"], ["", "", "", ""]], "hold": [["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "", "", "", "", "", "", "", "", "", "", ""], ["", "NAV", "NUM", ""]], "cat": [["sys", "none", "none", "none", "none", "none", "none", "none", "none", "none", "none", "sys"], ["none", "sys", "sys", "sys", "none", "none", "none", "none", "none", "none", "none", "none"], ["fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn", "fn"], ["ide", "none", "none", "none", "none", "ide", "none", "none", "ide", "none", "none", "ide"], ["trns", "trns", "trns", "trns"]], "changes": ["NEW. F1-F10 sit exactly where 1-0 are on NUM. F11 and F12 take the two outer home keys. VS Code: F2 rename (S), F12 go to definition (right outer), F8 next problem (K), F5 start/continue debug (G), F9 breakpoint (L), F10 step over, F11 step into.", "Bottom row = the shifted F-key above it: ⇧F5 stop debugging, ⇧F8 previous problem, ⇧F11 step out, ⇧F12 find references. Both thumbs are busy here, so the shifted versions need their own keys.", "System corner keys you need rarely and must never hit by accident: Boot (bootloader, for flashing) top-left, Lock (⌃⌘Q, lock screen) top-right, RGB on/off and LED brightness on the left.", "Build it as layer 5 in Oryx (it exports the keys and LEDs). The only custom C is the activation, update_tri_layer_state(state, 1, 3, 5)."], "why": "The layout had no F-keys at all, and they are the fastest route to rename, go to definition, next problem and the debugger in VS Code. A tri-layer keeps them on the home row under both thumbs, numbered exactly like your digits, without stealing a key or a thumb from anything else."}], "combos": [{"keys": "L-outer + L-inner thumbs (Space + Enter), pressed together", "output": "⇧⏎", "why": "Optional one-motion newline: roll the left thumb flat across both keys, so Enter alone sends and the 'fat' press makes a newline. If it fires by accident (a trailing space rolled into Enter) you get a newline, never a send. I add no combos on letter keys: with home-row mods, Chordal Hold and Flow Tap already in play, alpha combos are the next misfire source (for example ',+.' would fire on 'e.g.,'). Oryx supports thumb combos. Use COMBO_TERM 40."}], "macros": [{"label": "->", "sends": "->", "why": "SYM + N. On almost every fn signature and closure return type. It replaces a cross-hand '-' (U) then '>' (F)."}, {"label": "=>", "sends": "=>", "why": "SYM + M. On every match arm. It replaces a pinky stretch to '=' followed by '>'."}, {"label": "Lead m", "sends": "&mut ", "why": "The most common Rust token that isn't a single symbol. (C)"}, {"label": "Lead s", "sends": "&mut self", "why": "Nine characters for a mutating method signature. (C)"}, {"label": "Lead d", "sends": "#[derive(Debug, Clone)]", "why": "23 characters, typed on most struct/enum definitions. Edit it to your usual derive set. (C)"}, {"label": "Lead t", "sends": "#[test]", "why": "Unit tests. (C)"}, {"label": "Lead c", "sends": "#[cfg(test)]", "why": "The test module header. (C)"}, {"label": "Lead u", "sends": ".unwrap()", "why": "Prototyping and tests. (C)"}, {"label": "Lead e", "sends": ".expect(\"\") then ←← (cursor between the quotes)", "why": "Lands you ready to type the message. Works with or without editor auto-pairs, because VS Code and nvim-autopairs type over the auto-inserted closers. (C)"}, {"label": "Lead o", "sends": "Ok(())", "why": "Four shifted bracket chords on SYM become one sequence. (C)"}, {"label": "Lead p", "sends": "println!(\"{:?}\", ); then ←← (cursor before ')')", "why": "Debug printing. 20 characters, a third of them shifted symbols. (C)"}], "features": [{"name": "Tap-hold baseline (config.h)", "config": "#define TAPPING_TERM 200\n#define TAPPING_TERM_PER_KEY\n#define PERMISSIVE_HOLD_PER_KEY\n#define QUICK_TAP_TERM 120\n#define QUICK_TAP_TERM_PER_KEY", "why": "This keeps today's 200 ms feel and switches on the per-key callbacks below. Leave RETRO_TAPPING and HOLD_ON_OTHER_KEY_PRESS off: either one would make the Enter thumb fire (or turn into NAV) in situations where it doesn't today. Don't also set per-key tapping terms in Oryx, or the callbacks will be defined twice."}, {"name": "Per-key tap-hold callbacks (C)", "config": "uint16_t get_tapping_term(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(3, KC_ENTER) ? 175 : TAPPING_TERM; // Enter must be a crisp tap\n}\nbool get_permissive_hold(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE):          // prose safety: a lingering Space thumb must stay a space\n    case MT(MOD_RSFT, KC_ESCAPE):  // Vim safety: Esc rolled into j must not become ⇧J\n      return false;\n    default:\n      return true;                 // home-row mods (guarded by Chordal Hold + Flow Tap), Enter/NAV, Tab/NUM\n  }\n}\nuint16_t get_quick_tap_term(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE): case LT(3, KC_ENTER): case LT(1, KC_TAB): case MT(MOD_RSFT, KC_ESCAPE):\n      return 0;                    // tap-then-hold on a thumb always means the layer or mod, never auto-repeat\n    default:\n      return QUICK_TAP_TERM;       // keeps tap-then-hold repeat on the home-row keys (kkkk in Vim)\n  }\n}", "why": "Each line removes one misfire this user hits daily. ' {' and ' &' after a space; Esc→⇧ in Vim; 'Enter j' from a quick NAV chord. It also makes opposite-hand ⌘/⌃ shortcuts fire without waiting out the 200 ms."}, {"name": "Chordal Hold, thumbs exempt (C)", "config": "// config.h\n#define CHORDAL_HOLD\n// keymap.c\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n  'L','L','L','L','L','L',  'R','R','R','R','R','R',\n                    '*','*',  '*','*'\n);", "why": "A same-hand roll on a home-row mod (D then C mid-word) settles as letters immediately. The thumbs must be '*': Chordal Hold settles a same-hand press as a tap on the spot, which would otherwise break Space + left-hand symbols, NUM + right-hand digits and the FN tri-layer. The ':'/⌃ key (DUAL_FUNC_0 is really LT(3, KC_X)) is covered automatically."}, {"name": "Flow Tap on home-row mods only (C)", "config": "// config.h\n#define FLOW_TAP_TERM 150\n// keymap.c\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case MT(MOD_LCTL, KC_A): case MT(MOD_LALT, KC_S): case MT(MOD_LGUI, KC_D):\n    case MT(MOD_RGUI, KC_K): case MT(MOD_RALT, KC_L): case DUAL_FUNC_0:\n      return is_flow_tap_key(prev_keycode) ? FLOW_TAP_TERM : 0;\n    default:\n      return 0; // never on thumbs\n  }\n}", "why": "A home-row mod pressed within 150 ms of a letter is always a letter, which removes fast-typing mod misfires. The default get_flow_tap_term also applies to LT(2, KC_SPACE) because its tap is KC_SPC. That would force a space whenever you hold Space within 150 ms of a letter, so snake_case and 'foo(' would break. Hence the explicit scope. It already turns itself off while ⌘/⌃/⌥ is held."}, {"name": "Key override ⇧; → ? (C)", "config": "# rules.mk\nKEY_OVERRIDE_ENABLE = yes\n// keymap.c\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &shift_scln_ques };", "why": "This puts '?' back on Shift + the key right of '.', where every ANSI typist looks for it. That matters in chat. The ':' key and SEND_STRING macros are unaffected, because neither goes through KC_SCLN key events."}, {"name": "Caps Word on double-tap Shift", "config": "# rules.mk\nCAPS_WORD_ENABLE = yes\n// config.h\n#define DOUBLE_TAP_SHIFT_TURNS_ON_CAPS_WORD", "why": "This works with your OSM(MOD_LSFT). Caps Word is already compiled in (keyboard.json) but had no trigger. Use it for SCREAMING_SNAKE consts, statics and env vars. '_' keeps it going, so MAX_RETRY_COUNT is one go."}, {"name": "Leader with instant single-key sequences (C)", "config": "# rules.mk\nLEADER_ENABLE = yes\n// config.h\n#define LEADER_NO_TIMEOUT\n// keymap.c  (Oryx key = KC_F24 placeholder)\n// in process_record_user: case KC_F24: if (record->event.pressed) leader_start(); return false;\nbool leader_add_user(uint16_t keycode) { return true; } // every sequence is one key: fire immediately\nvoid leader_end_user(void) {\n  if      (leader_sequence_one_key(KC_M)) SEND_STRING(\"&mut \");\n  else if (leader_sequence_one_key(KC_S)) SEND_STRING(\"&mut self\");\n  else if (leader_sequence_one_key(KC_D)) SEND_STRING(\"#[derive(Debug, Clone)]\");\n  else if (leader_sequence_one_key(KC_T)) SEND_STRING(\"#[test]\");\n  else if (leader_sequence_one_key(KC_C)) SEND_STRING(\"#[cfg(test)]\");\n  else if (leader_sequence_one_key(KC_U)) SEND_STRING(\".unwrap()\");\n  else if (leader_sequence_one_key(KC_E)) SEND_STRING(\".expect(\\\"\\\")\" SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n  else if (leader_sequence_one_key(KC_O)) SEND_STRING(\"Ok(())\");\n  else if (leader_sequence_one_key(KC_P)) SEND_STRING(\"println!(\\\"{:?}\\\", );\" SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n}", "why": "This is Vim-style <leader> for the long Rust tokens, without spending prime keys on them. leader_add_user returning true fires on the first key, so there is no timeout lag. Leader resolves home-row mod-taps to their letters, so 's' and 'd' work. Any other key after Lead (Esc, say) just cancels."}, {"name": "FN tri-layer (C)", "config": "layer_state_t layer_state_set_user(layer_state_t state) {\n  return update_tri_layer_state(state, 1, 3, 5); // NUM + NAV → FN\n}", "why": "Holding both inner thumbs (you never hold them together for anything else today) opens F-keys on the home row. Layer 5 fits under LAYER_STATE_8BIT and sits above the automouse layer 4. Define the layer's keys and colours in Oryx. This function is the only code."}], "missing": ["F-keys: there were none anywhere. Now F1-F12 plus ⇧F5/⇧F8/⇧F11/⇧F12 on FN, numbered like your digits.", "Modifiers on NAV: ⌥←/⌥→ word jumps, ⌘←/⌘→ line ends, ⇧-selection and ⌘Tab were impossible.", "A dedicated, send-proof Shift+Enter (SYM + R-inner thumb, plus an optional thumb combo).", "Tap-hold safety config: no Chordal Hold, Flow Tap, permissive hold or quick-tap tuning, so ' {' after a space, Esc→⇧ in Vim and quick NAV chords misfired.", "A Caps Word trigger, though Caps Word is already compiled in.", "Rust token shortcuts: '->' and '=>' keys, Leader snippets for &mut, derive, test, cfg(test), unwrap, expect, Ok(()), println!.", "VS Code Quick Fix (⌘.) and the command palette (⌘⇧P) on NAV.", "Forward Delete.", "'?' on Shift + the old '/' key (ANSI position).", "Screenshot to the clipboard (⌃⌘⇧4) for pasting into chats.", "Bootloader, RGB and lock-screen keys."], "risks": ["Chordal Hold does not make same-hand shortcuts faster. D(⌘)+C still needs the >200 ms hold you use today. Opposite-hand ones (K+C, K+V, K+Z, ':'-key+C for ⌃C) become instant, so lean on those.", "Permissive hold on the home-row mods leaves one residual misfire. Start a word slowly after a pause of more than 150 ms with a lingering pinky ('a' still down while 'n' goes down and up) and you get ⌃N. Flow Tap only covers mid-word rolls. If it bites, return false from get_permissive_hold for A and the ':' key only.", "The Space thumb deliberately gets no permissive hold and no Flow Tap. '_' and the other symbols still need Space held a moment before you release the symbol key, as today. The win is that ' {', ' &' and ' ->' right after a space now work every time.", "Quick-tap 0 on the thumbs removes hold-to-repeat for Space, Enter, Tab and Esc. Backspace is a plain key and still repeats.", "Enter has a 175 ms tapping term, so a slow, hesitant Enter sends nothing. That is the point, but you may notice it for a day. One stray-Enter path remains: a very fast roll where the thumb comes up before the arrow key. If it still happens, enable hold-on-other-key-press for that one key, at the cost of Enter-then-letter rolls in code turning into NAV.", "NAV relearn: ⌃⇧G, ⌘⇧F and ⌘⇧H move up two rows. Expect about a week of reaching for the home row.", "The '/' ↔ '\\' swap breaks the mirror between SYM's and NUM's operator rows. On NUM, '/' stays on P.", "Leader snippets run as commands if you fire them in Vim normal mode. Use them in insert mode only.", "Several pieces are custom C (tap-hold callbacks, chordal layout, Flow Tap scope, key override, Leader, tri-layer). They live outside the Oryx keymap array, so re-exports merge cleanly, but a change in Oryx to the same keycodes (for example renaming DUAL_FUNC_0) needs a matching edit.", "macOS maps F11 to Show Desktop. Turn that off (System Settings → Keyboard → Keyboard Shortcuts → Mission Control) to get VS Code step-into back.", "The optional Space+Enter thumb combo depends on how comfortably your thumb covers both keys. If it feels awkward, skip it, because SYM + R-inner already gives ⇧⏎."]}, "meta": {"lede": "Your layers next to two independent redesigns: A (ergonomic minimalist) and B (pragmatic Rust/Vim). Every shortcut key shows what it does, and you can click any key to compare it across the three versions.", "introHTML": "\n<div class=\"grid2\">\n  <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:10px\">\n    <div class=\"eyebrow\">How I read your layout<\/div>\n    <h3>What you built<\/h3>\n    <ul><li><b>Base:<\/b> QWERTY with ⌃⌥⌘ home-row mods on A S D and K L ;, and nothing on F or J. Shift stays off the home row so you don't get stray capitals. <code>:<\/code> is unshifted on the home-row pinky for Vim and Rust <code>::<\/code>, and the number row is left blank on purpose.<\/li><li><b>Numbers<\/b> run along the home row. <b>Symbols<\/b> stack three bracket pairs under the left index and middle fingers. <b>Nav / IDE<\/b> has a VS Code panel cluster on the left, Vim arrows on HJKL and media on the right pinky.<\/li><li>Key colours follow your LED scheme: blue letters, green modifiers, pink digits, yellow symbols, teal VS Code keys, red arrows.<\/li><\/ul>\n  <\/div>\n  <div class=\"panel\" style=\"display:flex;flex-direction:column;gap:10px\">\n    <div class=\"eyebrow\">Both experts agree these are broken or missing<\/div>\n    <h3>What to fix<\/h3>\n    <ul><li><b>Tap-hold timing is on QMK defaults.<\/b> If you tap Space and then hold it straight away for a symbol, you get a repeated space and a letter (<code>fn main() {<\/code> comes out as <code>fn main()  j<\/code>). A quick Nav chord can also slip out an <b>Enter<\/b> and send a chat message.<\/li><li><b>Nav has no modifiers,<\/b> so ⌥← word jump, ⌘← line start and ⇧-arrow selection are awkward.<\/li><li><b>No F-keys at all,<\/b> so there's no F2 rename, F12 go to definition or F8 next problem.<\/li><li><b>Numbers use keypad keys,<\/b> which can misbehave in terminal Vim, and <code>MyComputer<\/code> does nothing on macOS.<\/li><li>Caps Word is already in your firmware, but no key turns it on.<\/li><\/ul>\n  <\/div>\n<\/div>\n<div class=\"grid2\" style=\"margin-top:16px\">\n  <div class=\"op A\" style=\"border-top:3px solid var(--a)\"><div style=\"display:flex;gap:8px;align-items:center\"><span class=\"tag tA\">Expert A<\/span><h3>Ergonomic minimalist<\/h3><\/div><p class=\"why\">Rebuilds the thumbs and layers so that each layer's keys sit on the opposite hand from the thumb that holds it. Backspace goes on a thumb, Shift on F and J, and the same modifiers repeat on every layer. Best ergonomics, but 2–4 weeks of relearning.<\/p><\/div>\n  <div class=\"op B\" style=\"border-top:3px solid var(--b)\"><div style=\"display:flex;gap:8px;align-items:center\"><span class=\"tag tB\">Expert B<\/span><h3>Pragmatic Rust / Vim<\/h3><\/div><p class=\"why\">Keeps your letters and thumbs, and fixes timing and the missing pieces: modifiers on Nav, F-keys, <code>-&gt;<\/code> and <code>=&gt;<\/code> keys, and Rust snippets on a Leader key. About 8 keys move, and it takes around a week to settle.<\/p><\/div>\n<\/div>\n<p style=\"margin-top:10px;font-size:13px;color:var(--muted)\">The two experts are independent AI reviewers, each arguing from one established school of layout design. They are not human experts. I checked their firmware claims against ZSA's firmware 25 source.<\/p>\n", "layerNotes": {"0": "Both experts keep QWERTY, your ⌃⌥⌘ order and <code>:<\/code> on the home row. Both make ⇧+; type <code>?<\/code>, where QWERTY fingers expect it. A moves Backspace to a thumb and turns Esc into a J+K combo. B keeps the thumbs and adds Leader, Caps Word and a clipboard screenshot on the empty top row.", "1": "Both swap the keypad operators for plain ones. A turns this layer into a right-hand numpad, held by the left thumb, with modifiers under the left fingers, so ⌘1–⌘9 becomes easy. B leaves your digits where they are. <b>My note on A:<\/b> drop its <i>hold-on-other-key-press<\/i> setting on the Tab thumb, because it turns a fast Tab-then-letter into a digit.", "2": "A moves every symbol to the left hand and holds this layer with the right thumb. B keeps your placement, swaps <code>/<\/code> and <code>\\<\/code>, and adds <code>-&gt;<\/code>, <code>=&gt;<\/code> and Shift+Enter keys. <b>My note on A:<\/b> <code>#<\/code> exists only on Numbers, so typing <code>#[derive]<\/code> means switching layers in the middle. Put <code>#<\/code> on a free symbol key.", "3": "Both put plain ⌃⌥⌘⇧ under your left fingers, so ⇧-arrow selection and ⌥ word jumps work, and both keep your HJKL arrows and tmux keys. A adds Undo/Cut/Copy/Paste and VS Code Back/Forward, and turns letter-based shortcuts into chords. B keeps every shortcut you have, moves three of them up two rows, and adds Quick Fix, Commands and forward Delete."}, "newNotes": ["Your layout has no F-keys. A puts them behind the Enter thumb in a numpad-shaped block. B opens them by holding <b>both inner thumbs<\/b>, with F1–F10 exactly where 1–0 are, so F2 is where 2 is."], "verdictHTML": "\n<div class=\"view\">\n  <div class=\"panel verdict\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <div class=\"eyebrow\">Verdict<\/div>\n    <h2>Start with B, and borrow two ideas from A<\/h2>\n    <p>B fixes everything that is actually broken (tap-hold timing, Nav with no modifiers, no F-keys, keypad codes) and moves only about 8 keys, so you stay fast in Rust and chat. A is the better long-term ergonomic choice, but it costs weeks of retraining, and two of its pieces need fixing first (the Tab-thumb setting, and <code>#<\/code> missing from Symbols).<\/p>\n    <p><b>Add to B from A:<\/b> VS Code Back and Forward (⌃- and ⌃⇧-) on a free Nav top-row key, which you'll use constantly after F12 go to definition, and Layer Lock on Numbers for long runs of digits.<\/p>\n    <p><b>If you later want A:<\/b> the firmware settings carry over unchanged. Move the thumbs on their own first (Backspace on a thumb is the biggest win), then Numbers and Symbols.<\/p>\n  <\/div>\n  <div class='tbl'><table><thead><tr><th>Topic<\/th><th class='tA'>Expert A<\/th><th class='tB'>Expert B<\/th><\/tr><\/thead><tbody><tr><td><b>Thumbs<\/b><\/td><td>Rebuilt: Space/Nav, Tab/Num, Enter/F-keys, Bspc/Sym<\/td><td>Kept: Space/Sym, Enter/Nav, Tab/Num, Esc/⇧, with timing fixed<\/td><\/tr><tr><td><b>Shift<\/b><\/td><td>Home-row F and J<\/td><td>Unchanged (one-shot ⇧ on the pinky, ⇧ on the thumb)<\/td><\/tr><tr><td><b>Esc<\/b><\/td><td>Tap J+K together<\/td><td>Unchanged (thumb and corner)<\/td><\/tr><tr><td><b>Backspace<\/b><\/td><td>Right thumb<\/td><td>Unchanged (top right, bottom left)<\/td><\/tr><tr><td><b>Numbers<\/b><\/td><td>Right-hand numpad, mods on the left<\/td><td>Home row as today, plain operators<\/td><\/tr><tr><td><b>Symbols<\/b><\/td><td>All on the left hand<\/td><td>Your positions, with / and \\ swapped and -&gt; and =&gt; added<\/td><\/tr><tr><td><b>Rust snippets<\/b><\/td><td>None<\/td><td>Leader: &amp;mut, #[derive], #[test], println!, Ok(())<\/td><\/tr><tr><td><b>F-keys<\/b><\/td><td>Hold the Enter thumb<\/td><td>Hold both inner thumbs, numbered like your digits<\/td><\/tr><tr><td><b>Keys moved<\/b><\/td><td>Most thumbs, all of Numbers and Symbols<\/td><td>About 8<\/td><\/tr><tr><td><b>Relearning<\/b><\/td><td>2–4 weeks<\/td><td>About a week, mostly on Nav<\/td><\/tr><\/tbody><\/table><\/div>\n  <h2>QMK features each expert turns on<\/h2>\n  <p>Both turn on <b>Chordal Hold<\/b> (stops fast same-hand rolls from triggering modifiers), <b>Flow Tap<\/b> (a key pressed mid-word is always a letter), <b>Permissive Hold<\/b>, <b>Caps Word<\/b> and <b>⇧; → ?<\/b>. B keeps Flow Tap off the Space thumb because Space holds Symbols in its layout. Without that, <code>user_name<\/code> would come out as <code>user hname<\/code>.<\/p>\n  <div class=\"opinions\">\n    <div class=\"op A\"><h3>Expert A<\/h3><ul><li><b>Chordal Hold, with thumbs exempt (the exemption is C)<\/b>: A home-row mod pressed with another key on the same hand types as a letter, which removes most rolling misfires such as &#x27;as&#x27; turning into ⌃s. Several mods on the same hand can still be held together, for example J+K for ⇧⌘. Without the &#x27;*&#x27; exemption, holding Space for NAV and then pressing ⇧ on F, or Shift on F plus Tab, would count as a same-hand roll.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>#define CHORDAL_HOLD\n// keymap.c (C): mark the thumbs &#x27;*&#x27; so the layer thumbs can chord with either hand\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n                 &#x27;*&#x27;,&#x27;*&#x27;,  &#x27;*&#x27;,&#x27;*&#x27;);<\/pre><\/details><\/li><li><b>Flow Tap, with Shift exempt (the per-key rule is C)<\/b>: If a home-row mod (or Space/NAV) is pressed within 150 ms of the previous letter, it is always a tap, so fast typing never fires a modifier and letters arrive without delay. Shift is exempt so capitals right after a space, and PascalCase such as HashMap, still work at full speed. Bspc/SYM, Tab/NUM and Enter/FUN aren&#x27;t covered by Flow Tap by default, so a symbol right after a letter, as in foo(, is still instant.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>#define FLOW_TAP_TERM 150\n// keymap.c (C)\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case LSFT_T(KC_F):\n    case RSFT_T(KC_J):\n      return 0;  // Shift: never force a tap\n  }\n  return (is_flow_tap_key(keycode) &amp;&amp; is_flow_tap_key(prev_keycode)) ? FLOW_TAP_TERM : 0;\n}<\/pre><\/details><\/li><li><b>Permissive Hold, plus Hold On Other Key Press for NUM (C)<\/b>: Permissive Hold lets a held layer or mod work as soon as you press and release another key inside it, so you don&#x27;t have to wait 200 ms for each symbol. NUM also uses Hold On Other Key Press: if you let go of the thumb before the digit, you still get the digit and not Tab+letter, which in Slack would move focus. Space keeps plain Permissive Hold because you roll from Space into letters all the time.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>#define TAPPING_TERM 200\n#define PERMISSIVE_HOLD\n#define HOLD_ON_OTHER_KEY_PRESS_PER_KEY\n// keymap.c (C)\nbool get_hold_on_other_key_press(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(1, KC_TAB);  // NUM thumb\n}<\/pre><\/details><\/li><li><b>Quick Tap Term<\/b>: Tap and then quickly hold a key to auto-repeat it: Bspc on the SYM thumb, or j in Vim, now that J is also Shift. A slower tap-then-hold still gives the modifier.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>#define QUICK_TAP_TERM 120<\/pre><\/details><\/li><li><b>Tap-only combos (C)<\/b>: Both combos use home-row mod keys. Tap-only means a held J+K or F+J falls through to the modifiers, so the combos never block ⇧⌘ or ⇧⇧ chords.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>COMBO_ENABLE = yes            # rules.mk\n#define COMBO_TERM 40\n#define COMBO_MUST_TAP_PER_COMBO\n// keymap.c (C)\nbool get_combo_must_tap(uint16_t index, combo_t *combo) { return true; }<\/pre><\/details><\/li><li><b>Caps Word<\/b>: Rust constants and enum-style identifiers are SCREAMING_SNAKE_CASE. Caps Word keeps going through _ (the SYM thumb) and digits, and stops by itself. You can turn it on from the F+J combo or the CapsW key on NAV.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>CAPS_WORD_ENABLE = yes        # rules.mk\n#define CAPS_WORD_IDLE_TIMEOUT 3000<\/pre><\/details><\/li><li><b>Key override: Shift+; sends ? (C)<\/b>: Puts ? back on its QWERTY spot (Shift plus the bottom-right pinky key) for chat questions and Rust&#x27;s ? operator, without using up a SYM slot. Shift+; was only a second copy of the : on the home row.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>KEY_OVERRIDE_ENABLE = yes     # rules.mk\n// keymap.c (C)\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &amp;shift_scln_ques };<\/pre><\/details><\/li><li><b>Layer Lock (already enabled)<\/b>: Lock NUM for long runs of numbers and MOUSE for long pointer sessions, without holding a thumb.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>LAYER_LOCK_ENABLE = yes       # rules.mk (already set)\nQK_LLCK on NUM (G) and MOUSE (B)<\/pre><\/details><\/li><li><b>Remove Tap Dance<\/b>: ⌘1 and ⌘2 (and ⌘3 to ⌘9) are now ⌘ plus a digit on NUM. The double-tap timing delay goes away, along with about 60 lines of generated C.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>TAP_DANCE_ENABLE = no         # rules.mk; delete DANCE_0 and its handlers<\/pre><\/details><\/li><\/ul><h3>Combos<\/h3><ul><li><b class='mono'>J+K (tap only)<\/b> → Esc: Vim needs Esc constantly, and this keeps it on the home row with no thumb or corner reach. It is tap-only, so holding J+K still gives ⇧⌘ for shortcuts like ⌘⇧E. &#x27;jk&#x27; almost never appears in English or Rust, so it rarely fires by accident.<\/li><li><b class='mono'>F+J (tap only)<\/b> → Caps Word: Tap both Shift keys together to type SCREAMING_SNAKE_CASE Rust constants and chat acronyms (API, PR, LLM) without holding Shift. Caps Word turns itself off at the next space or punctuation.<\/li><\/ul><\/div>\n    <div class=\"op B\"><h3>Expert B<\/h3><ul><li><b>Tap-hold baseline (config.h)<\/b>: This keeps today&#x27;s 200 ms feel and switches on the per-key callbacks below. Leave RETRO_TAPPING and HOLD_ON_OTHER_KEY_PRESS off: either one would make the Enter thumb fire (or turn into NAV) in situations where it doesn&#x27;t today. Don&#x27;t also set per-key tapping terms in Oryx, or the callbacks will be defined twice.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>#define TAPPING_TERM 200\n#define TAPPING_TERM_PER_KEY\n#define PERMISSIVE_HOLD_PER_KEY\n#define QUICK_TAP_TERM 120\n#define QUICK_TAP_TERM_PER_KEY<\/pre><\/details><\/li><li><b>Per-key tap-hold callbacks (C)<\/b>: Each line removes one misfire this user hits daily. &#x27; {&#x27; and &#x27; &amp;&#x27; after a space; Esc→⇧ in Vim; &#x27;Enter j&#x27; from a quick NAV chord. It also makes opposite-hand ⌘/⌃ shortcuts fire without waiting out the 200 ms.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>uint16_t get_tapping_term(uint16_t keycode, keyrecord_t *record) {\n  return keycode == LT(3, KC_ENTER) ? 175 : TAPPING_TERM; // Enter must be a crisp tap\n}\nbool get_permissive_hold(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE):          // prose safety: a lingering Space thumb must stay a space\n    case MT(MOD_RSFT, KC_ESCAPE):  // Vim safety: Esc rolled into j must not become ⇧J\n      return false;\n    default:\n      return true;                 // home-row mods (guarded by Chordal Hold + Flow Tap), Enter/NAV, Tab/NUM\n  }\n}\nuint16_t get_quick_tap_term(uint16_t keycode, keyrecord_t *record) {\n  switch (keycode) {\n    case LT(2, KC_SPACE): case LT(3, KC_ENTER): case LT(1, KC_TAB): case MT(MOD_RSFT, KC_ESCAPE):\n      return 0;                    // tap-then-hold on a thumb always means the layer or mod, never auto-repeat\n    default:\n      return QUICK_TAP_TERM;       // keeps tap-then-hold repeat on the home-row keys (kkkk in Vim)\n  }\n}<\/pre><\/details><\/li><li><b>Chordal Hold, thumbs exempt (C)<\/b>: A same-hand roll on a home-row mod (D then C mid-word) settles as letters immediately. The thumbs must be &#x27;*&#x27;: Chordal Hold settles a same-hand press as a tap on the spot, which would otherwise break Space + left-hand symbols, NUM + right-hand digits and the FN tri-layer. The &#x27;:&#x27;/⌃ key (DUAL_FUNC_0 is really LT(3, KC_X)) is covered automatically.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>// config.h\n#define CHORDAL_HOLD\n// keymap.c\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n                    &#x27;*&#x27;,&#x27;*&#x27;,  &#x27;*&#x27;,&#x27;*&#x27;\n);<\/pre><\/details><\/li><li><b>Flow Tap on home-row mods only (C)<\/b>: A home-row mod pressed within 150 ms of a letter is always a letter, which removes fast-typing mod misfires. The default get_flow_tap_term also applies to LT(2, KC_SPACE) because its tap is KC_SPC. That would force a space whenever you hold Space within 150 ms of a letter, so snake_case and &#x27;foo(&#x27; would break. Hence the explicit scope. It already turns itself off while ⌘/⌃/⌥ is held.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>// config.h\n#define FLOW_TAP_TERM 150\n// keymap.c\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case MT(MOD_LCTL, KC_A): case MT(MOD_LALT, KC_S): case MT(MOD_LGUI, KC_D):\n    case MT(MOD_RGUI, KC_K): case MT(MOD_RALT, KC_L): case DUAL_FUNC_0:\n
