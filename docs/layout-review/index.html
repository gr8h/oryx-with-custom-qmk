home-row keys (kkkk in Vim)\n  }\n}<\/pre><\/details><\/li><li><b>Chordal Hold, thumbs exempt (C)<\/b>: A same-hand roll on a home-row mod (D then C mid-word) settles as letters immediately. The thumbs must be &#x27;*&#x27;: Chordal Hold settles a same-hand press as a tap on the spot, which would otherwise break Space + left-hand symbols, NUM + right-hand digits and the FN tri-layer. The &#x27;:&#x27;/⌃ key (DUAL_FUNC_0 is really LT(3, KC_X)) is covered automatically.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>// config.h\n#define CHORDAL_HOLD\n// keymap.c\nconst char chordal_hold_layout[MATRIX_ROWS][MATRIX_COLS] PROGMEM = LAYOUT_voyager(\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n  &#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,&#x27;L&#x27;,  &#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,&#x27;R&#x27;,\n                    &#x27;*&#x27;,&#x27;*&#x27;,  &#x27;*&#x27;,&#x27;*&#x27;\n);<\/pre><\/details><\/li><li><b>Flow Tap on home-row mods only (C)<\/b>: A home-row mod pressed within 150 ms of a letter is always a letter, which removes fast-typing mod misfires. The default get_flow_tap_term also applies to LT(2, KC_SPACE) because its tap is KC_SPC. That would force a space whenever you hold Space within 150 ms of a letter, so snake_case and &#x27;foo(&#x27; would break. Hence the explicit scope. It already turns itself off while ⌘/⌃/⌥ is held.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>// config.h\n#define FLOW_TAP_TERM 150\n// keymap.c\nuint16_t get_flow_tap_term(uint16_t keycode, keyrecord_t *record, uint16_t prev_keycode) {\n  switch (keycode) {\n    case MT(MOD_LCTL, KC_A): case MT(MOD_LALT, KC_S): case MT(MOD_LGUI, KC_D):\n    case MT(MOD_RGUI, KC_K): case MT(MOD_RALT, KC_L): case DUAL_FUNC_0:\n      return is_flow_tap_key(prev_keycode) ? FLOW_TAP_TERM : 0;\n    default:\n      return 0; // never on thumbs\n  }\n}<\/pre><\/details><\/li><li><b>Key override ⇧; → ? (C)<\/b>: This puts &#x27;?&#x27; back on Shift + the key right of &#x27;.&#x27;, where every ANSI typist looks for it. That matters in chat. The &#x27;:&#x27; key and SEND_STRING macros are unaffected, because neither goes through KC_SCLN key events.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre># rules.mk\nKEY_OVERRIDE_ENABLE = yes\n// keymap.c\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &amp;shift_scln_ques };<\/pre><\/details><\/li><li><b>Caps Word on double-tap Shift<\/b>: This works with your OSM(MOD_LSFT). Caps Word is already compiled in (keyboard.json) but had no trigger. Use it for SCREAMING_SNAKE consts, statics and env vars. &#x27;_&#x27; keeps it going, so MAX_RETRY_COUNT is one go.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre># rules.mk\nCAPS_WORD_ENABLE = yes\n// config.h\n#define DOUBLE_TAP_SHIFT_TURNS_ON_CAPS_WORD<\/pre><\/details><\/li><li><b>Leader with instant single-key sequences (C)<\/b>: This is Vim-style &lt;leader&gt; for the long Rust tokens, without spending prime keys on them. leader_add_user returning true fires on the first key, so there is no timeout lag. Leader resolves home-row mod-taps to their letters, so &#x27;s&#x27; and &#x27;d&#x27; work. Any other key after Lead (Esc, say) just cancels.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre># rules.mk\nLEADER_ENABLE = yes\n// config.h\n#define LEADER_NO_TIMEOUT\n// keymap.c  (Oryx key = KC_F24 placeholder)\n// in process_record_user: case KC_F24: if (record-&gt;event.pressed) leader_start(); return false;\nbool leader_add_user(uint16_t keycode) { return true; } // every sequence is one key: fire immediately\nvoid leader_end_user(void) {\n  if      (leader_sequence_one_key(KC_M)) SEND_STRING(&quot;&amp;mut &quot;);\n  else if (leader_sequence_one_key(KC_S)) SEND_STRING(&quot;&amp;mut self&quot;);\n  else if (leader_sequence_one_key(KC_D)) SEND_STRING(&quot;#[derive(Debug, Clone)]&quot;);\n  else if (leader_sequence_one_key(KC_T)) SEND_STRING(&quot;#[test]&quot;);\n  else if (leader_sequence_one_key(KC_C)) SEND_STRING(&quot;#[cfg(test)]&quot;);\n  else if (leader_sequence_one_key(KC_U)) SEND_STRING(&quot;.unwrap()&quot;);\n  else if (leader_sequence_one_key(KC_E)) SEND_STRING(&quot;.expect(\\&quot;\\&quot;)&quot; SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n  else if (leader_sequence_one_key(KC_O)) SEND_STRING(&quot;Ok(())&quot;);\n  else if (leader_sequence_one_key(KC_P)) SEND_STRING(&quot;println!(\\&quot;{:?}\\&quot;, );&quot; SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n}<\/pre><\/details><\/li><li><b>FN tri-layer (C)<\/b>: Holding both inner thumbs (you never hold them together for anything else today) opens F-keys on the home row. Layer 5 fits under LAYER_STATE_8BIT and sits above the automouse layer 4. Define the layer&#x27;s keys and colours in Oryx. This function is the only code.<details><summary class='mono' style='cursor:pointer;font-size:12px;color:var(--muted)'>config<\/summary><pre>layer_state_t layer_state_set_user(layer_state_t state) {\n  return update_tri_layer_state(state, 1, 3, 5); // NUM + NAV → FN\n}<\/pre><\/details><\/li><\/ul><h3>Combos and macros<\/h3><ul><li><b class='mono'>L-outer + L-inner thumbs (Space + Enter), pressed together<\/b> → ⇧⏎: Optional one-motion newline: roll the left thumb flat across both keys, so Enter alone sends and the &#x27;fat&#x27; press makes a newline. If it fires by accident (a trailing space rolled into Enter) you get a newline, never a send. I add no combos on letter keys: with home-row mods, Chordal Hold and Flow Tap already in play, alpha combos are the next misfire source (for example &#x27;,+.&#x27; would fire on &#x27;e.g.,&#x27;). Oryx supports thumb combos. Use COMBO_TERM 40.<\/li><li><b class='mono'>-&gt;<\/b> sends <code>-&gt;<\/code>: SYM + N. On almost every fn signature and closure return type. It replaces a cross-hand &#x27;-&#x27; (U) then &#x27;&gt;&#x27; (F).<\/li><li><b class='mono'>=&gt;<\/b> sends <code>=&gt;<\/code>: SYM + M. On every match arm. It replaces a pinky stretch to &#x27;=&#x27; followed by &#x27;&gt;&#x27;.<\/li><li><b class='mono'>Lead m<\/b> sends <code>&amp;mut <\/code>: The most common Rust token that isn&#x27;t a single symbol. (C)<\/li><li><b class='mono'>Lead s<\/b> sends <code>&amp;mut self<\/code>: Nine characters for a mutating method signature. (C)<\/li><li><b class='mono'>Lead d<\/b> sends <code>#[derive(Debug, Clone)]<\/code>: 23 characters, typed on most struct/enum definitions. Edit it to your usual derive set. (C)<\/li><li><b class='mono'>Lead t<\/b> sends <code>#[test]<\/code>: Unit tests. (C)<\/li><li><b class='mono'>Lead c<\/b> sends <code>#[cfg(test)]<\/code>: The test module header. (C)<\/li><li><b class='mono'>Lead u<\/b> sends <code>.unwrap()<\/code>: Prototyping and tests. (C)<\/li><li><b class='mono'>Lead e<\/b> sends <code>.expect(&quot;&quot;) then ←← (cursor between the quotes)<\/code>: Lands you ready to type the message. Works with or without editor auto-pairs, because VS Code and nvim-autopairs type over the auto-inserted closers. (C)<\/li><li><b class='mono'>Lead o<\/b> sends <code>Ok(())<\/code>: Four shifted bracket chords on SYM become one sequence. (C)<\/li><li><b class='mono'>Lead p<\/b> sends <code>println!(&quot;{:?}&quot;, ); then ←← (cursor before &#x27;)&#x27;)<\/code>: Debug printing. 20 characters, a third of them shifted symbols. (C)<\/li><\/ul><\/div>\n  <\/div>\n  <div class=\"opinions\">\n    <div class=\"op A\"><h3>Risks and trade-offs (A)<\/h3><ul><li>This is a big relearn. Every thumb except Space changes its job, digits become a numpad, and SYM is new. Expect two to four weeks of slower typing, and longer before your symbol speed in Rust catches up.<\/li><li>Esc is a combo now. It fires when you release J+K, and you have to press both within 40 ms. Years of reaching for a corner or thumb Esc will pull at you at first.<\/li><li>Shift on the home row is new for you. Flow Tap is off for F and J on purpose, so that capitals work, which leaves those two protected only by Chordal Hold and Permissive Hold. A lingering index finger can produce a stray capital (in Vim normal mode, a stray O or J).<\/li><li>Flow Tap on Space/NAV means you have to pause about 150 ms after a letter before holding Space for arrows. If you don&#x27;t, you get a space.<\/li><li>Enter shares its key with the FUN hold. If you let go of the thumb before the F-key during a quick FUN press, you get Enter plus a letter, which sends a chat message. Hold FUN deliberately, or move FUN somewhere else if it bites.<\/li><li>Bspc shares its key with the SYM hold. If you let go of the thumb before the symbol key, you get Backspace plus a letter. It&#x27;s harmless and easy to see, but it will happen while you learn.<\/li><li>$ % ^ ~ now take three keys (⇧ plus a digit on NUM, or ⇧ plus ` on SYM).<\/li><li>⌘⇧E, ⌘⇧H, the copy-path keys, ⌘1/⌘2 and ⌥Space lose their own keys and become home-row chords, so each takes one key more than today.<\/li><li>In Vim, holding j to repeat now needs a tap first and then a hold, because J is Shift. Holding Space+J for repeated ↓ works too.<\/li><li>Chordal Hold for the thumbs, per-key Flow Tap, tap-only combos and the key override all need custom C, which Oryx can&#x27;t express. They live in this repo&#x27;s custom QMK merge, and you need to check they survive each Oryx re-export.<\/li><li>The mouse layer assumes your left hand is free for modifiers. If the Navigator is on the left half, ⌘-click still works, but you need to hold K (⌘) before moving the ball.<\/li><li>The outer columns go dark. If that&#x27;s too abrupt, put Esc, Bspc and Tab back in their old spots for two weeks as training wheels, then remove them.<\/li><li>&#x27; is still on an outer column (one sideways pinky reach), on purpose.<\/li><\/ul><\/div>\n    <div class=\"op B\"><h3>Risks and trade-offs (B)<\/h3><ul><li>Chordal Hold does not make same-hand shortcuts faster. D(⌘)+C still needs the &gt;200 ms hold you use today. Opposite-hand ones (K+C, K+V, K+Z, &#x27;:&#x27;-key+C for ⌃C) become instant, so lean on those.<\/li><li>Permissive hold on the home-row mods leaves one residual misfire. Start a word slowly after a pause of more than 150 ms with a lingering pinky (&#x27;a&#x27; still down while &#x27;n&#x27; goes down and up) and you get ⌃N. Flow Tap only covers mid-word rolls. If it bites, return false from get_permissive_hold for A and the &#x27;:&#x27; key only.<\/li><li>The Space thumb deliberately gets no permissive hold and no Flow Tap. &#x27;_&#x27; and the other symbols still need Space held a moment before you release the symbol key, as today. The win is that &#x27; {&#x27;, &#x27; &amp;&#x27; and &#x27; -&gt;&#x27; right after a space now work every time.<\/li><li>Quick-tap 0 on the thumbs removes hold-to-repeat for Space, Enter, Tab and Esc. Backspace is a plain key and still repeats.<\/li><li>Enter has a 175 ms tapping term, so a slow, hesitant Enter sends nothing. That is the point, but you may notice it for a day. One stray-Enter path remains: a very fast roll where the thumb comes up before the arrow key. If it still happens, enable hold-on-other-key-press for that one key, at the cost of Enter-then-letter rolls in code turning into NAV.<\/li><li>NAV relearn: ⌃⇧G, ⌘⇧F and ⌘⇧H move up two rows. Expect about a week of reaching for the home row.<\/li><li>The &#x27;/&#x27; ↔ &#x27;\\&#x27; swap breaks the mirror between SYM&#x27;s and NUM&#x27;s operator rows. On NUM, &#x27;/&#x27; stays on P.<\/li><li>Mouse layer: typing right after a click now types, but y, u and i are still mouse buttons for 750 ms. A tap on the left outer key there is a plain Shift, so a capital typed straight after a click can come out lowercase.<\/li><li>Leader snippets run as commands if you fire them in Vim normal mode. Use them in insert mode only.<\/li><li>Several pieces are custom C (tap-hold callbacks, chordal layout, Flow Tap scope, key override, Leader, tri-layer). They live outside the Oryx keymap array, so re-exports merge cleanly, but a change in Oryx to the same keycodes (for example renaming DUAL_FUNC_0) needs a matching edit.<\/li><li>macOS maps F11 to Show Desktop. Turn that off (System Settings → Keyboard → Keyboard Shortcuts → Mission Control) to get VS Code step-into back.<\/li><li>The optional Space+Enter thumb combo depends on how comfortably your thumb covers both keys. If it feels awkward, skip it, because SYM + R-inner already gives ⇧⏎.<\/li><\/ul><\/div>\n  <\/div>\n<\/section>\n<section class=\"layer\" id=\"verdict\">\n  <div class=\"eyebrow\">Verdict<\/div>\n  <h2>Which one to use<\/h2>\n  <div class='tbl'><table><thead><tr><th>Topic<\/th><th class='tA'>Expert A<\/th><th class='tB'>Expert B<\/th><\/tr><\/thead><tbody><tr><td><b>Thumbs<\/b><\/td><td>Rebuilt: Space/NAV, Tab/NUM, Enter/FN, Bspc/SYM<\/td><td>Kept: Space/SYM, Enter/NAV, Tab/NUM, Esc/⇧, with timing fixed<\/td><\/tr><tr><td><b>Shift<\/b><\/td><td>Home-row F and J<\/td><td>Unchanged (OS⇧ on the pinky, ⇧ on the thumb)<\/td><\/tr><tr><td><b>Esc<\/b><\/td><td>J+K tap combo<\/td><td>Unchanged (thumb tap and corner)<\/td><\/tr><tr><td><b>Backspace<\/b><\/td><td>Thumb tap (R-outer)<\/td><td>Unchanged (top-right and bottom-left)<\/td><\/tr><tr><td><b>Numbers<\/b><\/td><td>Right-hand numpad with mods on the left<\/td><td>Home row (unchanged), plain operators<\/td><\/tr><tr><td><b>Symbols<\/b><\/td><td>All on the left hand, held by the right thumb<\/td><td>Your positions, with / and \\ swapped and -&gt; and =&gt; keys added<\/td><\/tr><tr><td><b>Rust snippets<\/b><\/td><td>None<\/td><td>Leader: &amp;mut, #[derive], #[test], println!, Ok(())<\/td><\/tr><tr><td><b>F-keys<\/b><\/td><td>FN layer on the Enter thumb<\/td><td>Tri-layer, numbered like the digits<\/td><\/tr><tr><td><b>Chat ⇧⏎<\/b><\/td><td>⇧ (F or J) + Enter thumb<\/td><td>Dedicated key on SYM plus an optional thumb combo<\/td><\/tr><tr><td><b>Keys moved<\/b><\/td><td>Most thumbs, all of NUM and SYM<\/td><td>About 8<\/td><\/tr><tr><td><b>Relearning<\/b><\/td><td>2–4 weeks<\/td><td>About a week, mostly for NAV<\/td><\/tr><\/tbody><\/table><\/div>\n  <div class=\"panel verdict\" style=\"display:flex;flex-direction:column;gap:12px\">\n    <h3>My recommendation: start with B, and borrow three ideas from A<\/h3>\n    <p>B fixes everything that is actually broken: the tap-hold timing, NAV with no mods, the mouse layer swallowing keys, no F-keys and the keypad codes. It moves only about 8 keys, so you stay productive in Rust and chat this week. A's design is the better long-term ergonomic choice: Backspace on a thumb, symbols on the opposite hand, Shift on the home row. But it costs weeks of retraining, and three of its pieces need fixing first (the mouse <code>KC_NO<\/code> keys, the NUM hold-on-other-key setting, and <code>#<\/code> missing from SYM).<\/p>\n    <p><b>Worth adding to B from A:<\/b> VS Code Back and Forward (⌃- and ⌃⇧-) on a free NAV top-row key, which you'll use constantly after F12. ⌘Z/X/C/V on the mouse layer's Z X C V, which B already frees up. And Layer Lock on NUM for long runs of numbers.<\/p>\n    <p><b>If you later want A:<\/b> the firmware settings carry over unchanged, so you can move the thumbs on their own first (Bspc on a thumb is the biggest win), then NUM and SYM.<\/p>\n  <\/div>\n<\/section>\n"}};
const CATS = {alpha:"Letters",mod:"Modifiers",num:"Numbers",sym:"Symbols",edit:"Editing (Space, Bspc, Tab…)",nav:"Navigation",ide:"VS Code / app shortcuts",media:"Media",mouse:"Mouse",sys:"System",fn:"F-keys",macro:"Macros / tokens"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function keyEl(tap, hold, cat, changed){
  const d = document.createElement("div");
  let cls = "k";
  if (tap === "" && !hold) { cls += " trns"; tap = "▿"; }
  else if (tap === "--" && !hold) { cls += " none"; tap = ""; }
  else cls += " c-" + (cat || "none");
  const len = [...String(tap)].length;
  if (len >= 6) cls += " xlong"; else if (len >= 4) cls += " long";
  if (hold) cls += " has-h";
  if (changed) cls += " chg";
  d.className = cls;
  d.title = (tap && tap!=="▿" ? "Tap: " + tap : (tap==="▿" ? "Transparent" : "No key")) + (hold ? " · Hold: " + hold : "");
  d.innerHTML = `<span class="t">${esc(tap)}</span>` + (hold ? `<span class="h">${esc(hold)}</span>` : "");
  return d;
}

function board(layer, ref){
  const kb = document.createElement("div"); kb.className = "kb";
  const halves = document.createElement("div"); halves.className = "halves";
  const L = document.createElement("div"); L.className = "half";
  const R = document.createElement("div"); R.className = "half";
  for (let r = 0; r < 4; r++) for (let c = 0; c < 12; c++) {
    const t = layer.tap[r][c], h = layer.hold[r][c], k = layer.cat[r][c];
    const ch = ref ? (ref.tap[r][c] !== t || (ref.hold[r][c]||"") !== (h||"")) : false;
    (c < 6 ? L : R).appendChild(keyEl(t, h, k, ch));
  }
  halves.append(L, R); kb.appendChild(halves);
  const th = document.createElement("div"); th.className = "thumbs";
  const tl = document.createElement("div"); tl.className = "tpair l";
  const tr = document.createElement("div"); tr.className = "tpair r";
  for (let i = 0; i < 4; i++) {
    const t = layer.tap[4][i], h = layer.hold[4][i], k = layer.cat[4][i];
    const ch = ref ? (ref.tap[4][i] !== t || (ref.hold[4][i]||"") !== (h||"")) : false;
    (i < 2 ? tl : tr).appendChild(keyEl(t, h, k, ch));
  }
  const sl = document.createElement("div"); sl.className = "tside l"; sl.appendChild(tl);
  const sr = document.createElement("div"); sr.className = "tside r"; sr.appendChild(tr);
  th.append(sl, sr); kb.appendChild(th);
  return kb;
}

function boardBlock(label, layer, ref, tagCls){
  const wrap = document.createElement("div"); wrap.className = "board";
  const cap = document.createElement("div"); cap.className = "bcap";
  if (!layer) {
    cap.innerHTML = `<b>${esc(label)}</b><span>Not in this version</span>`;
    wrap.appendChild(cap); return wrap;
  }
  cap.innerHTML = `<b><span class="tag ${tagCls}">${esc(label)}</span> ${esc(layer.name)}</b><span>${esc(layer.activation||"")}</span>`;
  wrap.append(cap, board(layer, ref));
  return wrap;
}

function opinion(cls, title, layer){
  const d = document.createElement("div"); d.className = "op " + cls;
  if (!layer) { d.innerHTML = `<h3>${esc(title)}</h3><p class="why">No counterpart layer.</p>`; return d; }
  d.innerHTML = `<h3>${esc(title)}: ${esc(layer.name)}</h3><p class="why">${esc(layer.why||"")}</p>` +
    (layer.changes && layer.changes.length ? `<ul>${layer.changes.map(c=>`<li>${esc(c)}</li>`).join("")}</ul>` : "");
  return d;
}

function render(){
  const {cur, A, B, meta} = DATA;
  document.getElementById("lede").textContent = meta.lede;
  document.getElementById("intro").innerHTML = meta.introHTML;
  document.getElementById("legend").innerHTML = Object.entries(CATS).map(([k,v])=>`<span><i class="c-${k}"></i>${esc(v)}</span>`).join("") +
    `<span><i style="box-shadow:inset 0 0 0 2px var(--chg)"></i>Changed</span><span><i style="border:1px dashed var(--muted)"></i>Transparent</span>`;
  const host = document.getElementById("layers"), toc = document.getElementById("toc");
  const groups = [];
  cur.layers.forEach(cl => groups.push({id:"layer-"+cl.id, title:`Layer ${cl.id} · ${cl.name}`, cur:cl,
     a:A.layers.find(l=>l.replaces===cl.id), b:B.layers.find(l=>l.replaces===cl.id), note: meta.layerNotes[cl.id]}));
  const extraA = A.layers.filter(l=>l.replaces===null||l.replaces===undefined);
  const extraB = B.layers.filter(l=>l.replaces===null||l.replaces===undefined);
  const n = Math.max(extraA.length, extraB.length);
  for (let i=0;i<n;i++) groups.push({id:"new-"+i, title:`New layer ${i+1}`, cur:null, a:extraA[i], b:extraB[i], note: meta.newNotes[i]||""});
  groups.forEach(g=>{
    const s = document.createElement("section"); s.className = "layer"; s.id = g.id;
    s.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px"><div class="eyebrow">${esc(g.cur? "Your layer "+g.cur.id : "Added by the experts")}</div><h2>${esc(g.cur ? g.cur.name : (g.a||g.b).name + (g.a&&g.b&&g.a.name!==g.b.name ? " / " + g.b.name : ""))}</h2>${g.note?`<p>${g.note}</p>`:""}</div>`;
    const bs = document.createElement("div"); bs.className = "boards";
    bs.append(boardBlock("Current", g.cur, null, "tC"), boardBlock("A", g.a, g.cur, "tA"), boardBlock("B", g.b, g.cur, "tB"));
    s.appendChild(bs);
    const ops = document.createElement("div"); ops.className = "opinions";
    ops.append(opinion("A", "Expert A", g.a), opinion("B", "Expert B", g.b));
    s.appendChild(ops);
    host.appendChild(s);
    const a = document.createElement("a"); a.href = "#"+g.id; a.textContent = g.cur ? `L${g.cur.id} ${g.cur.name}` : (g.a||g.b).name; toc.appendChild(a);
  });
  document.getElementById("outro").innerHTML = meta.outroHTML;
  ["features","verdict"].forEach(id=>{ const t=document.getElementById(id); if(t){ const a=document.createElement("a"); a.href="#"+id; a.textContent = id==="features"?"Features & config":"Verdict"; toc.appendChild(a);} });
}
render();
document.getElementById("chg").addEventListener("change", e => document.getElementById("layers").classList.toggle("showchg", e.target.checked));
document.getElementById("hold").addEventListener("change", e => document.querySelectorAll(".k .h").forEach(h => h.hidden = !e.target.checked));
</script>
