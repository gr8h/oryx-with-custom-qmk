    return is_flow_tap_key(prev_keycode) ? FLOW_TAP_TERM : 0;\n    default:\n      return 0; // never on thumbs\n  }\n}<\/pre><\/details><\/li><li><b>Key override ⇧; → ? (C)<\/b>: This puts &#x27;?&#x27; back on Shift + the key right of &#x27;.&#x27;, where every ANSI typist looks for it. That matters in chat. The &#x27;:&#x27; key and SEND_STRING macros are unaffected, because neither goes through KC_SCLN key events.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre># rules.mk\nKEY_OVERRIDE_ENABLE = yes\n// keymap.c\nconst key_override_t shift_scln_ques = ko_make_basic(MOD_MASK_SHIFT, KC_SCLN, KC_QUES);\nconst key_override_t *key_overrides[] = { &amp;shift_scln_ques };<\/pre><\/details><\/li><li><b>Caps Word on double-tap Shift<\/b>: This works with your OSM(MOD_LSFT). Caps Word is already compiled in (keyboard.json) but had no trigger. Use it for SCREAMING_SNAKE consts, statics and env vars. &#x27;_&#x27; keeps it going, so MAX_RETRY_COUNT is one go.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre># rules.mk\nCAPS_WORD_ENABLE = yes\n// config.h\n#define DOUBLE_TAP_SHIFT_TURNS_ON_CAPS_WORD<\/pre><\/details><\/li><li><b>Leader with instant single-key sequences (C)<\/b>: This is Vim-style &lt;leader&gt; for the long Rust tokens, without spending prime keys on them. leader_add_user returning true fires on the first key, so there is no timeout lag. Leader resolves home-row mod-taps to their letters, so &#x27;s&#x27; and &#x27;d&#x27; work. Any other key after Lead (Esc, say) just cancels.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre># rules.mk\nLEADER_ENABLE = yes\n// config.h\n#define LEADER_NO_TIMEOUT\n// keymap.c  (Oryx key = KC_F24 placeholder)\n// in process_record_user: case KC_F24: if (record-&gt;event.pressed) leader_start(); return false;\nbool leader_add_user(uint16_t keycode) { return true; } // every sequence is one key: fire immediately\nvoid leader_end_user(void) {\n  if      (leader_sequence_one_key(KC_M)) SEND_STRING(&quot;&amp;mut &quot;);\n  else if (leader_sequence_one_key(KC_S)) SEND_STRING(&quot;&amp;mut self&quot;);\n  else if (leader_sequence_one_key(KC_D)) SEND_STRING(&quot;#[derive(Debug, Clone)]&quot;);\n  else if (leader_sequence_one_key(KC_T)) SEND_STRING(&quot;#[test]&quot;);\n  else if (leader_sequence_one_key(KC_C)) SEND_STRING(&quot;#[cfg(test)]&quot;);\n  else if (leader_sequence_one_key(KC_U)) SEND_STRING(&quot;.unwrap()&quot;);\n  else if (leader_sequence_one_key(KC_E)) SEND_STRING(&quot;.expect(\\&quot;\\&quot;)&quot; SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n  else if (leader_sequence_one_key(KC_O)) SEND_STRING(&quot;Ok(())&quot;);\n  else if (leader_sequence_one_key(KC_P)) SEND_STRING(&quot;println!(\\&quot;{:?}\\&quot;, );&quot; SS_TAP(X_LEFT) SS_TAP(X_LEFT));\n}<\/pre><\/details><\/li><li><b>FN tri-layer (C)<\/b>: Holding both inner thumbs (you never hold them together for anything else today) opens F-keys on the home row. Layer 5 fits under LAYER_STATE_8BIT and sits above the automouse layer 4. Define the layer&#x27;s keys and colours in Oryx. This function is the only code.<details><summary class='mono' style='font-size:12px;color:var(--muted)'>show config<\/summary><pre>layer_state_t layer_state_set_user(layer_state_t state) {\n  return update_tri_layer_state(state, 1, 3, 5); // NUM + NAV → FN\n}<\/pre><\/details><\/li><\/ul><h3>Combos and macros<\/h3><ul><li><b class='mono'>L-outer + L-inner thumbs (Space + Enter), pressed together<\/b> → ⇧⏎: Optional one-motion newline: roll the left thumb flat across both keys, so Enter alone sends and the &#x27;fat&#x27; press makes a newline. If it fires by accident (a trailing space rolled into Enter) you get a newline, never a send. I add no combos on letter keys: with home-row mods, Chordal Hold and Flow Tap already in play, alpha combos are the next misfire source (for example &#x27;,+.&#x27; would fire on &#x27;e.g.,&#x27;). Oryx supports thumb combos. Use COMBO_TERM 40.<\/li><li><b class='mono'>-&gt;<\/b> types <code>-&gt;<\/code>: SYM + N. On almost every fn signature and closure return type. It replaces a cross-hand &#x27;-&#x27; (U) then &#x27;&gt;&#x27; (F).<\/li><li><b class='mono'>=&gt;<\/b> types <code>=&gt;<\/code>: SYM + M. On every match arm. It replaces a pinky stretch to &#x27;=&#x27; followed by &#x27;&gt;&#x27;.<\/li><li><b class='mono'>Lead m<\/b> types <code>&amp;mut <\/code>: The most common Rust token that isn&#x27;t a single symbol. (C)<\/li><li><b class='mono'>Lead s<\/b> types <code>&amp;mut self<\/code>: Nine characters for a mutating method signature. (C)<\/li><li><b class='mono'>Lead d<\/b> types <code>#[derive(Debug, Clone)]<\/code>: 23 characters, typed on most struct/enum definitions. Edit it to your usual derive set. (C)<\/li><li><b class='mono'>Lead t<\/b> types <code>#[test]<\/code>: Unit tests. (C)<\/li><li><b class='mono'>Lead c<\/b> types <code>#[cfg(test)]<\/code>: The test module header. (C)<\/li><li><b class='mono'>Lead u<\/b> types <code>.unwrap()<\/code>: Prototyping and tests. (C)<\/li><li><b class='mono'>Lead e<\/b> types <code>.expect(&quot;&quot;) then ←← (cursor between the quotes)<\/code>: Lands you ready to type the message. Works with or without editor auto-pairs, because VS Code and nvim-autopairs type over the auto-inserted closers. (C)<\/li><li><b class='mono'>Lead o<\/b> types <code>Ok(())<\/code>: Four shifted bracket chords on SYM become one sequence. (C)<\/li><li><b class='mono'>Lead p<\/b> types <code>println!(&quot;{:?}&quot;, ); then ←← (cursor before &#x27;)&#x27;)<\/code>: Debug printing. 20 characters, a third of them shifted symbols. (C)<\/li><\/ul><\/div>\n  <\/div>\n  <div class=\"opinions\">\n    <div class=\"op A\"><h3>Risks and trade-offs (A)<\/h3><ul><li>This is a big relearn. Every thumb except Space changes its job, digits become a numpad, and SYM is new. Expect two to four weeks of slower typing, and longer before your symbol speed in Rust catches up.<\/li><li>Esc is a combo now. It fires when you release J+K, and you have to press both within 40 ms. Years of reaching for a corner or thumb Esc will pull at you at first.<\/li><li>Shift on the home row is new for you. Flow Tap is off for F and J on purpose, so that capitals work, which leaves those two protected only by Chordal Hold and Permissive Hold. A lingering index finger can produce a stray capital (in Vim normal mode, a stray O or J).<\/li><li>Flow Tap on Space/NAV means you have to pause about 150 ms after a letter before holding Space for arrows. If you don&#x27;t, you get a space.<\/li><li>Enter shares its key with the FUN hold. If you let go of the thumb before the F-key during a quick FUN press, you get Enter plus a letter, which sends a chat message. Hold FUN deliberately, or move FUN somewhere else if it bites.<\/li><li>Bspc shares its key with the SYM hold. If you let go of the thumb before the symbol key, you get Backspace plus a letter. It&#x27;s harmless and easy to see, but it will happen while you learn.<\/li><li>$ % ^ ~ now take three keys (⇧ plus a digit on NUM, or ⇧ plus ` on SYM).<\/li><li>⌘⇧E, ⌘⇧H, the copy-path keys, ⌘1/⌘2 and ⌥Space lose their own keys and become home-row chords, so each takes one key more than today.<\/li><li>In Vim, holding j to repeat now needs a tap first and then a hold, because J is Shift. Holding Space+J for repeated ↓ works too.<\/li><li>Chordal Hold for the thumbs, per-key Flow Tap, tap-only combos and the key override all need custom C, which Oryx can&#x27;t express. They live in this repo&#x27;s custom QMK merge, and you need to check they survive each Oryx re-export.<\/li><li>The outer columns go dark. If that&#x27;s too abrupt, put Esc, Bspc and Tab back in their old spots for two weeks as training wheels, then remove them.<\/li><li>&#x27; is still on an outer column (one sideways pinky reach), on purpose.<\/li><\/ul><\/div>\n    <div class=\"op B\"><h3>Risks and trade-offs (B)<\/h3><ul><li>Chordal Hold does not make same-hand shortcuts faster. D(⌘)+C still needs the &gt;200 ms hold you use today. Opposite-hand ones (K+C, K+V, K+Z, &#x27;:&#x27;-key+C for ⌃C) become instant, so lean on those.<\/li><li>Permissive hold on the home-row mods leaves one residual misfire. Start a word slowly after a pause of more than 150 ms with a lingering pinky (&#x27;a&#x27; still down while &#x27;n&#x27; goes down and up) and you get ⌃N. Flow Tap only covers mid-word rolls. If it bites, return false from get_permissive_hold for A and the &#x27;:&#x27; key only.<\/li><li>The Space thumb deliberately gets no permissive hold and no Flow Tap. &#x27;_&#x27; and the other symbols still need Space held a moment before you release the symbol key, as today. The win is that &#x27; {&#x27;, &#x27; &amp;&#x27; and &#x27; -&gt;&#x27; right after a space now work every time.<\/li><li>Quick-tap 0 on the thumbs removes hold-to-repeat for Space, Enter, Tab and Esc. Backspace is a plain key and still repeats.<\/li><li>Enter has a 175 ms tapping term, so a slow, hesitant Enter sends nothing. That is the point, but you may notice it for a day. One stray-Enter path remains: a very fast roll where the thumb comes up before the arrow key. If it still happens, enable hold-on-other-key-press for that one key, at the cost of Enter-then-letter rolls in code turning into NAV.<\/li><li>NAV relearn: ⌃⇧G, ⌘⇧F and ⌘⇧H move up two rows. Expect about a week of reaching for the home row.<\/li><li>The &#x27;/&#x27; ↔ &#x27;\\&#x27; swap breaks the mirror between SYM&#x27;s and NUM&#x27;s operator rows. On NUM, &#x27;/&#x27; stays on P.<\/li><li>Leader snippets run as commands if you fire them in Vim normal mode. Use them in insert mode only.<\/li><li>Several pieces are custom C (tap-hold callbacks, chordal layout, Flow Tap scope, key override, Leader, tri-layer). They live outside the Oryx keymap array, so re-exports merge cleanly, but a change in Oryx to the same keycodes (for example renaming DUAL_FUNC_0) needs a matching edit.<\/li><li>macOS maps F11 to Show Desktop. Turn that off (System Settings → Keyboard → Keyboard Shortcuts → Mission Control) to get VS Code step-into back.<\/li><li>The optional Space+Enter thumb combo depends on how comfortably your thumb covers both keys. If it feels awkward, skip it, because SYM + R-inner already gives ⇧⏎.<\/li><\/ul><\/div>\n  <\/div>\n<\/div>\n", "slugs": {"0": "base", "1": "numbers", "2": "symbols", "3": "nav"}}, "G": {"⌃⇧G": ["Git", "VS Code: open the Source Control (Git) panel."], "⌘⇧F": ["Find all", "VS Code: search across every file in the project."], "⌘⇧H": ["Replace all", "VS Code: find and replace across every file in the project."], "⌘⇧E": ["Explorer", "VS Code: show the file Explorer sidebar."], "⌘⇧P": ["Palette", "VS Code: open the command palette."], "⌘\\": ["Split", "VS Code: split the editor into a second pane."], "⌘⇧[": ["Prev tab", "Previous tab (VS Code, browser, terminal)."], "⌘⇧]": ["Next tab", "Next tab (VS Code, browser, terminal)."], "⌘↓": ["File end", "Cmd+Down: jump to the end of the file in an editor. In Finder it opens the selected item."], "⌘.": ["Quick fix", "VS Code: Quick Fix. With rust-analyzer: add a missing import, fill in match arms, and so on."], "⌃`": ["Terminal", "VS Code: show or hide the built-in terminal."], "⌘1/2": ["Group 1/2", "Tap dance. Tap for ⌘1 (focus editor group 1), double-tap for ⌘2 (focus editor group 2)."], "⌥⌘⇧C": ["Rel path", "VS Code: copy the current file's path relative to the project."], "⌥⌘C": ["Full path", "VS Code: copy the current file's full path. In Finder, Copy Path."], "⌃-": ["Back", "VS Code: go back to where the cursor was before, e.g. after F12 go to definition."], "⌃⇧-": ["Forward", "VS Code: go forward again after Back."], "⌘Z": ["Undo", "Undo."], "⌘X": ["Cut", "Cut."], "⌘C": ["Copy", "Copy."], "⌘V": ["Paste", "Paste."], "⌘⇧Z": ["Redo", "Redo."], "⌥P": ["Prev win", "Right-Option+P. Probably your tmux or Zellij binding for the previous window. I'm inferring this from the P/H/L/N pattern."], "⌥H": ["Pane ←", "Right-Option+H. Probably your tmux or Zellij binding to move to the pane on the left (inferred)."], "⌥L": ["Pane →", "Right-Option+L. Probably your tmux or Zellij binding to move to the pane on the right (inferred)."], "⌥N": ["Next win", "Right-Option+N. Probably your tmux or Zellij binding for the next window (inferred)."], "⌥Spc": ["Launcher", "Option+Space. By default this opens the quick-entry window of the ChatGPT or Claude desktop app (my reading of what you use it for)."], "⌘⇧4": ["Shot file", "macOS: screenshot a selected area and save it as a file."], "⌃⌘⇧4": ["Shot clip", "macOS: screenshot a selected area to the clipboard, ready to paste into a chat."], "Lock": ["Lock Mac", "Lock the screen (⌃⌘Q)."], "Boot": ["Flash", "Put the keyboard into bootloader mode for flashing new firmware."], "RGB": ["LEDs", "Turn the keyboard LEDs on or off."], "Bri-": ["LED −", "LED brightness down."], "Bri+": ["LED +", "LED brightness up."], "MyPC": ["No-op", "'My Computer' media key. It does nothing on macOS."], "Play": ["Play", "Play or pause media."], "Stop": ["Stop", "Stop media. Most macOS apps ignore it."], "Vol-": ["Vol −", "Volume down."], "Vol+": ["Vol +", "Volume up."], "Mute": ["Mute", "Mute audio."], "Del": ["Del →", "Forward delete: deletes the character after the cursor. A Mac keyboard has no such key without fn."], "Home": ["Home", "Start of line in VS Code. In many Mac apps it jumps to the top of the document instead."], "End": ["End", "End of line in VS Code. In many Mac apps it jumps to the bottom of the document instead."], "PgUp": ["PgUp", "Page up."], "PgDn": ["PgDn", "Page down."], "Bspc": ["Bspc", "Backspace."], "Esc": ["Esc", "Escape. Leaves insert mode in Vim."], "Enter": ["Enter", "Enter. In chat apps this sends the message."], "Tab": ["Tab", "Tab, or accept a completion."], "Space": ["Space", "Space."], "⇧⏎": ["Newline", "Shift+Enter: a new line in Slack or a chat app, without sending."], "OS⇧": ["One-shot ⇧", "One-shot Shift: tap it, and the next key you press comes out capitalised."], "Lead": ["Leader", "Leader key: tap it, then one letter, to type a Rust snippet. For example m gives &mut and d gives #[derive(Debug, Clone)]."], "CW": ["Caps Word", "Caps Word: types the next word in capitals, carries on through _, and stops at a space. Use it for SCREAMING_SNAKE consts."], "CapsW": ["Caps Word", "Caps Word: types the next word in capitals, carries on through _, and stops at a space. Use it for SCREAMING_SNAKE consts."], "LLock": ["Lock layer", "Layer Lock: keeps the current layer on until you tap it again, so you don't have to hold a thumb."], "->": ["->", "Macro: types -> (function return type)."], "=>": ["=>", "Macro: types => (match arm)."], "KP-": ["KP −", "Keypad minus. In terminal Vim it can send a different code from a normal '-'."], "KP+": ["KP +", "Keypad plus. In terminal Vim it can send a different code from a normal '+'."], "KP*": ["KP *", "Keypad multiply. In terminal Vim it can send a different code from a normal '*'."], "KP/": ["KP /", "Keypad divide. In terminal Vim it can send a different code from a normal '/'."], "F1": ["F1", "VS Code: command palette."], "F2": ["F2", "VS Code: rename symbol."], "F3": ["F3", "VS Code: next search match."], "F4": ["F4", "VS Code: next result in the Search panel."], "F5": ["F5", "VS Code: start or continue debugging."], "F6": ["F6", "VS Code: pause the debugger."], "F7": ["F7", "VS Code: next change in the diff view."], "F8": ["F8", "VS Code: next problem (compiler error or warning)."], "F9": ["F9", "VS Code: toggle a breakpoint."], "F10": ["F10", "VS Code: step over."], "F11": ["F11", "VS Code: step into. macOS takes F11 for Show Desktop unless you turn that off."], "F12": ["F12", "VS Code: go to definition."], "⇧F5": ["⇧F5", "VS Code: stop debugging."], "⇧F8": ["⇧F8", "VS Code: previous problem."], "⇧F11": ["⇧F11", "VS Code: step out."], "⇧F12": ["⇧F12", "VS Code: find all references."]}, "FCAP": {"F1": "palette", "F2": "rename", "F3": "find nxt", "F4": "result", "F5": "debug", "F6": "pause", "F7": "diff", "F8": "problem", "F9": "brkpt", "F10": "step ovr", "F11": "step in", "F12": "go to def", "⇧F5": "stop", "⇧F8": "prev prb", "⇧F11": "step out", "⇧F12": "refs"}, "HOLD": {"⌃": "Control", "⌥": "Option", "⌘": "Command", "⇧": "Shift", "SYM": "Symbols layer", "NAV": "Navigation layer", "NUM": "Numbers layer", "FN": "F-key layer", "FUN": "F-key / media layer"}};
const {cur, A, B, meta, G, FCAP, HOLD} = DATA;
const CATS = {alpha:"Letters",mod:"Modifiers",num:"Numbers",sym:"Symbols",edit:"Editing keys",nav:"Navigation",ide:"VS Code / app shortcuts",media:"Media",sys:"System",fn:"F-keys",macro:"Macros / features"};
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const VERS = [["C","Current",cur,"tC"],["A","Expert A",A,"tA"],["B","Expert B",B,"tB"]];
const ROWN = ["top row","upper row","home row","bottom row"];
const COLN = ["left outer","left pinky","left ring","left middle","left index","left inner","right inner","right index","right middle","right ring","right pinky","right outer"];
const THN = ["left outer thumb","left inner thumb","right inner thumb","right outer thumb"];
const posName = (r,c) => r===4 ? THN[c] : `${ROWN[r]}, ${COLN[c]}`;

// groups = tab pages
const groups = [];
cur.layers.forEach(cl => groups.push({slug: meta.slugs[cl.id], title: cl.name, layers: {C: cl, A: A.layers.find(l=>l.replaces===cl.id), B: B.layers.find(l=>l.replaces===cl.id)}, note: meta.layerNotes[cl.id]}));
const ea = A.layers.filter(l=>l.replaces==null), eb = B.layers.filter(l=>l.replaces==null);
for (let i=0;i<Math.max(ea.length,eb.length);i++) groups.push({slug: i? "new"+i : "fkeys", title: "F-keys (new)", layers:{C:null, A:ea[i], B:eb[i]}, note: meta.newNotes[i]||""});

function describe(tap, hold){
  const out = {name: "", desc: ""};
  if (tap === "" ) { out.name = "—"; out.desc = "Transparent: falls through to the Base layer key."; }
  else if (tap === "--") { out.name = "—"; out.desc = "No key."; }
  else {
    const g = G[tap];
    out.name = tap;
    out.desc = g ? g[1] : (tap.length===1 ? `Types ${tap}` : tap);
  }
  if (hold) out.desc += ` Hold: ${HOLD[hold] || hold}.`;
  return out;
}

function keyEl(tap, hold, cat, changed, r, c){
  const b = document.createElement("button"); b.type = "button";
  let cls = "k", top = "", main = tap, glyph = tap, word = false;
  if (tap === "") { cls += " trns"; main = glyph = "▿"; }
  else if (tap === "--" && !hold) { cls += " none"; main = glyph = ""; }
  else {
    cls += " c-" + (cat || "edit");
    const g = G[tap];
    if (FCAP[tap]) { top = FCAP[tap]; }
    else if (g && g[0] !== tap) { top = tap; main = g[0]; word = /[a-z]/i.test(main); }
  }
  if (changed) cls += " chg";
  b.className = cls; b.dataset.r = r; b.dataset.c = c;
  const d = describe(tap, hold);
  b.setAttribute("aria-label", `${posName(r,c)}: ${d.name}. ${d.desc}`);
  b.title = d.desc;
  b.innerHTML = (top ? `<span class="top">${esc(top)}</span>` : "") +
    `<span class="main${word?" word":""}${word && main.length<=4?" short":""}">${esc(main)}</span><span class="glyph">${esc(glyph)}</span>` +
    (hold ? `<span class="h">${esc(hold)}</span>` : "");
  return b;
}

function board(layer, ref){
  const kb = document.createElement("div"); kb.className = "kb";
  const halves = document.createElement("div"); halves.className = "halves";
  const L = document.createElement("div"); L.className = "half";
  const R = document.createElement("div"); R.className = "half";
  const diff = (r,c) => ref ? (ref.tap[r][c] !== layer.tap[r][c] || (ref.hold[r][c]||"") !== (layer.hold[r][c]||"")) : false;
  for (let r=0;r<4;r++) for (let c=0;c<12;c++) (c<6?L:R).appendChild(keyEl(layer.tap[r][c], layer.hold[r][c], layer.cat[r][c], diff(r,c), r, c));
  halves.append(L,R); kb.appendChild(halves);
  const th = document.createElement("div"); th.className = "thumbs";
  const tl = document.createElement("div"); tl.className = "tpair l";
  const tr = document.createElement("div"); tr.className = "tpair r";
  for (let i=0;i<4;i++) (i<2?tl:tr).appendChild(keyEl(layer.tap[4][i], layer.hold[4][i], layer.cat[4][i], diff(4,i), 4, i));
  const sl = document.createElement("div"); sl.className = "tside l"; sl.appendChild(tl);
  const sr = document.createElement("div"); sr.className = "tside r"; sr.appendChild(tr);
  th.append(sl,sr); kb.appendChild(th);
  return kb;
}

function glossary(layer){
  const box = document.createElement("div"); box.className = "gl";
  const items = [], holds = [];
  for (let r=0;r<5;r++) for (let c=0;c<(r===4?4:12);c++){
    const t = layer.tap[r][c], h = layer.hold[r][c];
    const g = G[t];
    if (g && (g[0] !== t || FCAP[t] || ["OS⇧","Lead","CW","CapsW","LLock","->","=>","Del","⇧⏎","MyPC","Stop","Home","End"].includes(t))) items.push({r,c,chip:t,name:g[0],desc:g[1]});
    if (h) holds.push({r,c,chip:(t && t!=="--" ? t : "·") , name:"hold → " + (HOLD[h]||h), desc:""});
  }
  if (items.length){
    box.insertAdjacentHTML("beforeend", `<h4>What the special keys do</h4>`);
    items.forEach(it => box.appendChild(glItem(it)));
  }
  if (holds.length){
    box.insertAdjacentHTML("beforeend", `<h4 style="margin-top:8px">Hold actions</h4>`);
    holds.forEach(it => box.appendChild(glItem(it)));
  }
  if (!items.length && !holds.length) box.innerHTML = `<p class="none-msg">Only letters, digits and symbols here. Every key types what it shows.</p>`;
  return box;
}
function glItem(it){
  const b = document.createElement("button"); b.type="button"; b.dataset.r = it.r; b.dataset.c = it.c;
  b.innerHTML = `<span class="chip">${esc(it.chip)}</span><span><b>${esc(it.name)}</b>${it.desc?` · ${esc(it.desc)}`:""}</span>`;
  return b;
}

function opinion(cls, title, layer){
  const d = document.createElement("div"); d.className = "op " + cls;
  if (!layer) { d.innerHTML = `<h3>${esc(title)}</h3><p class="why">No counterpart layer.</p>`; return d; }
  const ch = layer.changes||[];
  d.innerHTML = `<h3>${esc(title)}: why this version</h3><p class="why">${esc(layer.why||"")}</p>` + (ch.length ? `<details open><summary class="eyebrow">Every change (${ch.length})</summary><ul style="margin-top:8px">${ch.map(c=>`<li>${esc(c)}</li>`).join("")}</ul></details>` : "");
  return d;
}

let sel = null;
function renderGroup(g){
  const main = document.getElementById("main"); main.innerHTML = "";
  if (g.slug === "verdict") { main.innerHTML = meta.verdictHTML; return; }
  const v = document.createElement("div"); v.className = "view " + (compact ? "compact" : "") + (showChg ? " showchg" : "");
  v.innerHTML = `<div style="display:flex;flex-direction:column;gap:6px"><h2>${esc(g.title)}</h2>${g.note?`<p class="note">${g.note}</p>`:""}</div>`;
  const cmp = document.createElement("div"); cmp.className = "cmp"; cmp.id = "cmp";
  v.appendChild(cmp);
  const vs = document.createElement("div"); vs.className = "versions";
  VERS.forEach(([k,label,_,tcls]) => {
    const layer = g.layers[k];
    const card = document.createElement("div"); card.className = "vcard " + k; card.dataset.v = k;
    if (!layer){ card.innerHTML = `<div class="vhead"><span class="tag ${tcls}">${esc(label)}</span><h3>No F-key layer</h3></div><p class="none-msg">Your current layout has no F-keys on any layer.</p>`; vs.appendChild(card); return; }
    card.innerHTML = `<div class="vhead"><span class="tag ${tcls}">${esc(label)}</span><h3>${esc(layer.name)}</h3><span class="act">${esc(layer.activation||"")}</span></div>`;
    const body = document.createElement("div"); body.className = "vbody";
    const wrap = document.createElement("div"); wrap.className = "kbwrap"; wrap.appendChild(board(layer, k==="C"?null:g.layers.C));
    body.append(wrap, glossary(layer)); card.appendChild(body); vs.appendChild(card);
  });
  v.appendChild(vs);
  const ops = document.createElement("div"); ops.className = "opinions";
  ops.append(opinion("A","Expert A",g.layers.A), opinion("B","Expert B",g.layers.B));
  v.appendChild(ops);
  main.appendChild(v);
  v.addEventListener("click", e => { const t = e.target.closest("[data-r]"); if (t) select(g, +t.dataset.r, +t.dataset.c); });
  // default selection: first key that differs and has a description
  if (!sel || sel.g !== g.slug) {
    let pick = null;
    const ref = g.layers.C || g.layers.A;
    outer: for (let r=0;r<5;r++) for (let c=0;c<(r===4?4:12);c++){
      const vals = ["C","A","B"].map(k=>g.layers[k] ? g.layers[k].tap[r][c] : null);
      if (new Set(vals).size>1 && vals.some(x=>G[x])) { pick=[r,c]; break outer; }
    }
    sel = {g:g.slug, r:(pick||[2,1])[0], c:(pick||[2,1])[1]};
  }
  select(g, sel.r, sel.c);
}

function select(g, r, c){
  sel = {g:g.slug, r, c};
  document.querySelectorAll(".k.sel").forEach(k=>k.classList.remove("sel"));
  document.querySelectorAll(`.k[data-r="${r}"][data-c="${c}"]`).forEach(k=>k.classList.add("sel"));
  document.querySelectorAll(".gl button").forEach(b=>b.classList.toggle("on", +b.dataset.r===r && +b.dataset.c===c));
  const cmp = document.getElementById("cmp"); if (!cmp) return;
  cmp.innerHTML = `<div class="eyebrow">Selected key · ${esc(posName(r,c))}</div><div class="cmp-grid">` + VERS.map(([k,label,_,tcls]) => {
    const l = g.layers[k];
    if (!l) return `<div class="cmp-cell"><span class="tag ${tcls}" style="align-self:flex-start">${esc(label)}</span><span class="big">—</span><span class="desc">This layer doesn't exist in this version.</span></div>`;
    const t = l.tap[r][c], h = l.hold[r][c]; const d = describe(t,h);
    const g2 = G[t]; const nm = t==="" ? "▿ transparent" : t==="--" ? "no key" : (g2 && g2[0]!==t ? `${g2[0]}  (${t})` : t);
    return `<div class="cmp-cell"><span class="tag ${tcls}" style="align-self:flex-start">${esc(label)}</span><span class="big">${esc(nm)}${h?` <span class="mono" style="font-size:13px;color:var(--muted)">hold ${esc(h)}</span>`:""}</span><span class="desc">${esc(d.desc)}</span></div>`;
  }).join("") + `</div>`;
}

// state + routing
let compact = false, showChg = true;
try { compact = localStorage.getItem("vlr-compact")==="1"; } catch(e){}
const pages = [...groups, {slug:"verdict", title:"Features & verdict"}];
const tabs = document.getElementById("tabs");
pages.forEach(p => { const a = document.createElement("a"); a.href = "#"+p.slug; a.textContent = p.title; a.dataset.slug = p.slug; tabs.appendChild(a); });
function route(){
  const slug = (location.hash||"").slice(1);
  const p = pages.find(x=>x.slug===slug) || pages[0];
  tabs.querySelectorAll("a").forEach(a => { if (a.dataset.slug===p.slug) a.setAttribute("aria-current","page"); else a.removeAttribute("aria-current"); });
  renderGroup(p);
}
window.addEventListener("hashchange", route);
function setView(c){ compact = c; try{localStorage.setItem("vlr-compact", c?"1":"0")}catch(e){}
  document.getElementById("v-detail").setAttribute("aria-pressed", String(!c));
  document.getElementById("v-compact").setAttribute("aria-pressed", String(c));
  const v = document.querySelector(".view"); if (v) v.classList.toggle("compact", c); }
document.getElementById("v-detail").addEventListener("click", ()=>setView(false));
document.getElementById("v-compact").addEventListener("click", ()=>setView(true));
document.getElementById("chg").addEventListener("change", e => { showChg = e.target.checked; const v = document.querySelector(".view"); if (v) v.classList.toggle("showchg", showChg); });

document.getElementById("lede").textContent = meta.lede;
document.getElementById("intro").innerHTML = meta.introHTML;
document.getElementById("legend").innerHTML = Object.entries(CATS).map(([k,v])=>`<span><i class="c-${k}"></i>${esc(v)}</span>`).join("") +
  `<span><i style="box-shadow:inset 0 0 0 2px var(--chg)"></i>Changed from current</span><span><i style="border:1px dashed var(--muted)"></i>Transparent (uses the Base key)</span>`;
setView(compact);
route();
</script>
